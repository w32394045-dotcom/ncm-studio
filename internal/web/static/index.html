      <p class="secnote" id="coverNeteaseNote" hidden></p>
      <div>
        <button class="btn btn-sm" id="coverFetch" type="button">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-cloud-down"/></svg>
          <span data-i18n="cover.fetch"></span>
        </button>
      </div>
    </div>

    <div class="coversec">
      <div class="coversec-head">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-history"/></svg>
        <h4 data-i18n="cover.history"></h4>
        <span class="spacer"></span>
        <span class="hint" data-i18n="cover.historyHint"></span>
      </div>
      <ul class="tiles" id="coverHistory"></ul>
      <p class="secnote" id="coverHistoryNone" hidden data-i18n="cover.noHistory"></p>
    </div>
  </div>
</dialog>

<dialog id="ask">
  <form class="dlg-form" id="askForm">
    <h3 id="askTitle"></h3>
    <p class="dlg-body" id="askBody" hidden></p>
    <div class="field" id="askField">
      <label for="askInput" id="askLabel"></label>
      <input class="input" id="askInput" autocomplete="off" spellcheck="false">
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="askCancel" data-i18n="common.cancel"></button>
      <button type="submit" class="btn btn-primary" id="askOk" data-i18n="common.confirm"></button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
"use strict";
(function () {

/* ── State ──────────────────────────────────────────────────────────────── */
const S = {
  cfg: {
    dir: "", output: "", workspace: "", workers: 3, lyrics: 2, lang: "",
    lrcOutput: "", lrcConflict: 0, aiTarget: "", aiProvider: "", aiModel: "",
    aiTranslated: 0, lyricsSource: 0,
    deleteSource: 0, initialized: false,
  },
  dict: {},
  lang: "zh-CN",
  files: [],
  jobs: new Map(),      // path -> job item
  selected: new Set(),
  modes: new Map(),     // path -> landing override for this one file
  running: false,
  batch: { total: 0, done: 0 },
  tab: "convert",
  browse: { path: "", parent: "", entries: [], roots: [] },
  rows: new Map(),      // path -> <li> in the convert list
  // scanning is a walk in flight and total how many rows the last render put
  // in the list; between them they decide which of the two empty blocks — the
  // placeholder or the "nothing here" — is the true one; see paintFileEmpty.
  scanning: false, total: 0,
  // pick is the delete picker a long press opens: the ticks in the list below
  // then mean "delete these" instead of "convert these". snapshot is the
  // selection the picker took over, put back if it is left without deleting.
  pick: { on: false, snapshot: null, firedAt: 0 },
  // batchPaths is what this batch was asked to do, as opposed to everything the
  // server still remembers: the offer to delete the sources at the end is about
  // the run that just finished.
  batchPaths: new Set(),
  // runPicked is what the running batch was queued with; see settlePick.
  runPicked: new Set(),
  meta: { version: "dev", home: "", configDir: "", defaultWorkspace: "" },
};

const FALLBACK_LANGS = ["zh-CN", "zh-TW", "en", "ja", "ko"];
const LANG_NAMES = {
  "zh-CN": "简体中文", "zh-TW": "繁體中文", "en": "English",
  "ja": "日本語", "ko": "한국어",
};

const $ = (id) => document.getElementById(id);

/* ── Remembered UI state ────────────────────────────────────────────────── */
// The server owns the settings. This keeps only what belongs to this browser
// and is not worth a request: which tab was open, which folders were used
// recently, whether the scan recursed.
const UI_KEY = "ncm-studio.ui.v1";

function loadUI() {
  try {
    return JSON.parse(localStorage.getItem(UI_KEY)) || {};
  } catch (_) {
    // Private windows, cleared storage and a corrupt value all land here; the
    // page has to work without any of it.
    return {};
  }
}

function saveUI(patch) {
  try {
    localStorage.setItem(UI_KEY, JSON.stringify(Object.assign(loadUI(), patch)));
  } catch (_) {}
}

// rememberDir keeps a short list of folders the user has actually used, which
// is what makes the picker useful on the second visit rather than the tenth.
function rememberDir(path) {
  path = String(path || "").trim();
  if (!path) return;
  const recent = loadUI().recent || [];
  saveUI({ recent: [path].concat(recent.filter((p) => p !== path)).slice(0, 8) });
}

/* ── i18n ───────────────────────────────────────────────────────────────── */
function t(key, vars) {
  const table = S.dict[S.lang] || S.dict["en"] || {};
  let s = table[key];
  if (s === undefined) s = (S.dict["en"] || {})[key];
  if (s === undefined) return key;
  if (vars) {
    for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  }
  return s;
}

function detectLang() {
  const tags = navigator.languages || [navigator.language || "en"];
  for (const raw of tags) {
    const tag = String(raw);
    if (/^zh\b/i.test(tag)) {
      return /Hant|TW|HK|MO/i.test(tag) ? "zh-TW" : "zh-CN";
    }
    const base = tag.split("-")[0].toLowerCase();
    if (FALLBACK_LANGS.includes(base)) return base;
  }
  return "en";
}

// applyStatic re-translates everything marked up in the HTML. Text nodes carry
// data-i18n; attributes that are not text — a placeholder, an aria-label —
// carry data-i18n-attr as "attr:key" pairs separated by commas.
function applyStatic(root) {
  const scope = root || document;
  scope.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.dataset.i18n);
  });
  scope.querySelectorAll("[data-i18n-attr]").forEach((el) => {
    for (const pair of el.dataset.i18nAttr.split(",")) {
      const at = pair.indexOf(":");
      if (at < 0) continue;
      el.setAttribute(pair.slice(0, at).trim(), t(pair.slice(at + 1).trim()));
    }
  });
}

function setLang(lang, persist) {
  if (!S.dict[lang]) lang = "en";
  S.lang = lang;
  document.documentElement.lang = lang;
  applyStatic();
  fillLangSelects();
  renderFiles();
  renderBrowser();
  renderRunBar();
  renderDirCards();
  renderLyrics();
  renderLRC();
  renderAI();
  renderAISettings();
  renderCovers();
  renderInfo();
  if ($("cover").open) cover.render();
  if (persist) saveConfig({ lang: lang });
}

function fillLangSelects() {
  const langs = Object.keys(S.dict).length ? Object.keys(S.dict) : FALLBACK_LANGS;
  for (const sel of [$("lang"), $("setLang")]) {
    if (!sel) continue;
    sel.innerHTML = "";
    for (const code of langs) {
      const o = document.createElement("option");
      o.value = code;
      o.textContent = LANG_NAMES[code] || code;
      sel.appendChild(o);
    }
    sel.value = S.lang;
  }
}

/* ── API ────────────────────────────────────────────────────────────────── */
async function api(path, opts) {
  const res = await fetch(path, opts);
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("application/json") ? await res.json() : await res.text();
  if (!res.ok) {
    throw new Error((body && body.error) || res.statusText || ("HTTP " + res.status));
  }
  return body;
}

const post = (path, data) =>
  api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data || {}),
  });

/* ── Toasts ─────────────────────────────────────────────────────────────── */
function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  const icon = kind === "err" ? "i-alert" : "i-check-circle";
  el.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#' + icon + '"/></svg>';
  const span = document.createElement("span");
  span.textContent = msg;
  el.appendChild(span);
  $("toasts").appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity 180ms";
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 200);
  }, kind === "err" ? 5200 : 3200);
}

/* ── Dialog (prompt / confirm) ──────────────────────────────────────────── */
function openDialog(opts) {
  return new Promise((resolve) => {
    const dlg = $("ask");
    $("askTitle").textContent = opts.title || "";
    const body = $("askBody");
    body.textContent = opts.body || "";
    body.hidden = !opts.body;

    const field = $("askField");
    const input = $("askInput");
    const useInput = opts.value !== undefined;
    field.hidden = !useInput;
    $("askLabel").textContent = opts.label || "";
    input.value = useInput ? opts.value : "";

    const ok = $("askOk");
    ok.textContent = opts.confirmText || t("common.confirm");
    ok.className = "btn " + (opts.danger ? "btn-danger" : "btn-primary");
    $("askCancel").textContent = t("common.cancel");

    let done = false;
    const finish = (val) => {
      if (done) return;
      done = true;
      $("askForm").removeEventListener("submit", onSubmit);
      dlg.removeEventListener("close", onClose);
      if (dlg.open) dlg.close();
      resolve(val);
    };
    const onSubmit = (e) => {
      e.preventDefault();
      finish(useInput ? input.value.trim() : true);
    };
    const onClose = () => finish(useInput ? null : false);

    $("askForm").addEventListener("submit", onSubmit);
    dlg.addEventListener("close", onClose);
    $("askCancel").onclick = () => finish(useInput ? null : false);

    dlg.showModal();
    if (useInput) {
      setTimeout(() => {
        input.focus();
        input.select();
      }, 30);
    } else {
      ok.focus();
    }
  });
}

const askText = (opts) => openDialog(opts);
const askConfirm = (opts) =>
  openDialog({ title: opts.title, body: opts.body, danger: opts.danger, confirmText: opts.confirmText });

/* ── Formatting ─────────────────────────────────────────────────────────── */
function fmtBytes(n) {
  if (n === null || n === undefined || isNaN(n)) return "";
  if (n < 1024) return n + " B";
  const units = ["KB", "MB", "GB", "TB"];
  let v = n, i = -1;
  do { v /= 1024; i++; } while (v >= 1024 && i < units.length - 1);
  return (v < 10 ? v.toFixed(1) : Math.round(v)) + " " + units[i];
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  try {
    return new Intl.DateTimeFormat(S.lang, { dateStyle: "short", timeStyle: "short" }).format(d);
  } catch (_) {
    return d.toLocaleString();
  }
}

const baseName = (p) => String(p || "").replace(/\/+$/, "").split("/").pop() || "/";

/* ── Tabs ───────────────────────────────────────────────────────────────── */
const PANELS = {
  convert: "panel-convert",
  lyrics: "panel-lyrics",
  lrc: "panel-lrc",
  ai: "panel-ai",
  covers: "panel-covers",
  info: "panel-info",
  files: "panel-files",
  settings: "panel-settings",
};

function showTab(name, opts) {
  if (!PANELS[name]) name = "convert";
  S.tab = name;
  saveUI({ tab: name });
  for (const key in PANELS) $(PANELS[key]).hidden = key !== name;
  document.querySelectorAll("#tabs .tab").forEach((b) => {
    b.setAttribute("aria-selected", String(b.dataset.tab === name));
  });
  if (name === "files" && (!S.browse.entries.length || (opts && opts.reload))) {
    loadDir(S.browse.path || S.cfg.dir);
  }
  if (name === "convert") syncSourceDir();
  // Both list pages scan on first open rather than at boot: a folder of a few
  // hundred files is a few hundred reads, and most visits never leave the
  // convert tab.
  if (name === "lyrics") {
    syncDirField("lyricDir", "lyricRecursive");
    if (!L.loaded || (opts && opts.reload)) scanLyrics();
  }
  if (name === "lrc") {
    syncDirField("lrcDir", "lrcRecursive");
    if (!R.loaded || (opts && opts.reload)) scanLRC();
    connectLRC();
    loadLRCState();
  }
  if (name === "ai") {
    syncDirField("aiDir", "aiRecursive");
    if (!A.settingsLoaded) { A.settingsLoaded = true; loadAISettings(); }
    if (!A.loaded || (opts && opts.reload)) scanAI();
    connectAI();
    loadAIState();
  }
  if (name === "info") {
    syncDirField("infoDir", "infoRecursive");
    if (!INFO.loaded || (opts && opts.reload)) scanInfo();
  }
  if (name === "covers") {
    syncDirField("coverDir", "coverRecursive");
    if (!C.loaded || (opts && opts.reload)) scanCovers();
  }
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

document.querySelectorAll("#tabs .tab").forEach((btn) => {
  btn.addEventListener("click", () => showTab(btn.dataset.tab));
});

/* ── Config ─────────────────────────────────────────────────────────────── */
let saveTimer = 0;
let savePending = {};
let saveSeq = 0;
function saveConfig(patch) {
  // Patches accumulate instead of replacing one another: two settings changed
  // inside the debounce window are two changes, and sending only the last would
  // leave the first applied to the local copy alone until the server's reply —
  // which never heard about it — overwrote it back.
  Object.assign(S.cfg, patch);
  Object.assign(savePending, patch);
  const seq = ++saveSeq;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const body = savePending;
    savePending = {};
    try {
      const cfg = await post("/api/config", body);
      // A reply that a newer edit has already overtaken describes a server
      // state the page has moved past; adopting it would undo that edit on
      // screen. The newer request's own reply is the one that lands last.
      if (seq !== saveSeq) return;
      S.cfg = cfg;
      syncSettings();
      syncSourceDir();
      renderDirCards();
    } catch (err) {
      toast(t("settings.saveFailed", { msg: err.message }), "err");
    }
  }, 250);
}

/* The concurrency setting is reachable from two places — the settings tab and
   the stepper beside the start button — so both go through here rather than
   each writing S.cfg themselves and drifting apart. */
const WORKERS_MIN = 1;
const WORKERS_MAX = 16;

function clampWorkers(n) {
  if (!Number.isFinite(n)) return 3;
  return Math.min(WORKERS_MAX, Math.max(WORKERS_MIN, Math.round(n)));
}

function renderWorkers() {
  const n = clampWorkers(S.cfg.workers);
  $("setWorkers").value = String(n);
  $("setWorkersVal").textContent = String(n);
  $("workerStepVal").textContent = String(n);
  // At the ceiling the stepper stops being a choice and starts being a warning:
  // more workers than the phone has cores only makes every file slower.
  $("workerStep").toggleAttribute("data-full", n >= WORKERS_MAX);
  $("workerDown").disabled = n <= WORKERS_MIN;
  $("workerUp").disabled = n >= WORKERS_MAX;
  // The visible label is just "并发" and it disappears on a narrow screen, so
  // the group and both buttons carry the full wording for a screen reader.
  $("workerStep").setAttribute("aria-label", t("settings.workers"));
  $("workerDown").setAttribute("aria-label", t("run.concurrencyDown"));
  $("workerUp").setAttribute("aria-label", t("run.concurrencyUp"));
}

function setWorkers(n) {
  const clamped = clampWorkers(n);
  // Paint before the round trip so the stepper feels like a control rather
  // than a request, then let the server's echo settle it.
  S.cfg.workers = clamped;
  renderWorkers();
  saveConfig({ workers: clamped });
}

/* The scan's size filter. The server is the one that decides: it stores a byte
   count and only keeps the unit as the way the number is shown. This side reads
   that count back into a number and a unit, and writes a change as a unit and a
   number — the byte value is derived in one place, on the server, so the two
   cannot drift apart when the unit changes. */
const SIZE_UNITS = { kb: 1024, mb: 1024 * 1024, gb: 1024 * 1024 * 1024 };
const DEFAULT_MIN_SIZE = 500 * 1024;

function minSizeUnit() {
  const u = S.cfg.minSize && S.cfg.minSize.unit;
  return SIZE_UNITS[u] ? u : "kb";
}

function minSizeBytes() {
  const n = S.cfg.minSize && S.cfg.minSize.bytes;
  return Number(n) > 0 ? Number(n) : 0;
}

// A number that reads like a person wrote it: 500 rather than 500.0, and 1.5
// rather than 1.5000000001 after a round trip through bytes.
function minSizeAmount() {
  const bytes = minSizeBytes();
  if (!bytes) return 0;
  const factor = SIZE_UNITS[minSizeUnit()];
  const amount = bytes / factor;
  return Math.abs(amount - Math.round(amount)) < 1e-6 ? Math.round(amount)
                                                      : Number(amount.toFixed(3));
}

function renderMinSize() {
  const el = $("setMinSize");
  const unit = $("setMinSizeUnit");
  if (!el || !unit) return;
  el.value = minSizeBytes() ? String(minSizeAmount()) : "";
  unit.value = minSizeUnit();
  // The placeholder only shows when the field is empty, and an empty field is
  // how the filter is turned off — so the placeholder has to say what "empty"
  // means rather than repeat the label.
  el.placeholder = t("settings.minSizeOff");
}

// A change is saved on the two events that mean "I am done typing": leaving the
// field, and pressing Enter. Saving on every keystroke would send a request per
// digit, and each one would rewrite the settings file.
function saveMinSize() {
  const raw = $("setMinSize").value.trim();
  const unit = $("setMinSizeUnit").value;
  const amount = raw === "" ? 0 : Number(raw);
  if (!Number.isFinite(amount) || amount < 0) {
    renderMinSize();
    return;
  }
  const bytes = Math.round(amount * (SIZE_UNITS[unit] || 1024));
  S.cfg.minSize = { bytes: bytes, unit: unit };
  renderMinSize();
  // Sent as the pair the field holds: a number of bytes the user just chose,
  // and the unit to show it in. The server clamps both.
  saveConfig({ minSize: { bytes: bytes, unit: unit }, minSizeUnit: unit });
  // A scan already on screen was filtered by the previous value, so the list
  // would keep showing rows the new setting excludes — or hide rows it now
  // allows. Re-scanning is the honest answer, and it is what the user is about
  // to do anyway.
  rescanAfterMinSize();
}

// rescanAfterMinSize re-runs whichever list is on screen, once, on the next
// tick: the settings page can be reached from every tab, and the scans behind
// them are the things the filter governs.
let minSizeRescan = 0;
function rescanAfterMinSize() {
  clearTimeout(minSizeRescan);
  minSizeRescan = setTimeout(() => {
    if (S.tab === "convert") scan();
    else if (S.tab === "lyrics") scanLyrics();
    else if (S.tab === "covers") scanCovers();
    else if (S.tab === "lrc") scanLRC();
    else if (S.tab === "ai") scanAI();
    else if (S.tab === "info") scanInfo();
  }, 400);
}

function syncSettings() {
  $("setDir").value = S.cfg.dir || "";
  $("setOut").value = S.cfg.output || "";
  $("setWork").value = S.cfg.workspace || "";
  renderWorkers();
  renderMinSize();
  const radios = document.querySelectorAll('input[name="lyrics"]');
  radios.forEach((r) => { r.checked = Number(r.value) === Number(S.cfg.lyrics); });
  $("setLrcOut").value = S.cfg.lrcOutput || "";
  document.querySelectorAll('input[name="lrcConflict"]').forEach((r) => {
    r.checked = Number(r.value) === Number(S.cfg.lrcConflict || 0);
  });
  document.querySelectorAll('input[name="deleteSource"]').forEach((r) => {
    r.checked = Number(r.value) === Number(S.cfg.deleteSource || 0);
  });
  document.querySelectorAll('input[name="lyricSource"]').forEach((r) => {
    r.checked = Number(r.value) === Number(S.cfg.lyricsSource || 0);
  });
  document.querySelectorAll('input[name="aiTranslated"]').forEach((r) => {
    r.checked = Number(r.value) === Number(S.cfg.aiTranslated || 0);
  });
  $("setLang").value = S.lang;
}

function syncSourceDir() {
  const el = $("srcDir");
  if (document.activeElement !== el) el.value = S.cfg.dir || "";
}

// syncDirField fills one list page's folder box from the settings, and its
// recursion box from what was chosen on that page last time. Recursion is
// remembered per page on purpose: walking a whole library is a reasonable
// thing to want on the lyrics page and a bad default for the file browser.
function syncDirField(dirId, recursiveId) {
  const el = $(dirId);
  if (el && document.activeElement !== el) el.value = S.cfg.dir || "";
  const box = $(recursiveId);
  if (box) box.checked = !!loadUI()[recursiveId];
}

/* ── Source list ────────────────────────────────────────────────────────── */
function jobFor(path) { return S.jobs.get(path); }

// The states a run leaves a file in when there is nothing left to do with it:
// decrypted, or passed over because it already was. A failed one is not in
// here — a failure is the row worth running again.
const SETTLED = new Set(["done", "skipped"]);

// runPicked is the set a bag's batch started with, put there by startX. It is
// what lets a row let go of its tick without the page having watched it go
// pending → running → done: an event the phone missed, or a file that was
// already in a settled state when the batch began, would otherwise leave the
// tick sitting on a file that is finished. A row only leaves on a state change
// as well, so that a scan — which re-ticks everything worth doing while nothing
// is running — is not undone by the leftovers of the run before it.
function settlePick(bag, path, was, state, onChange) {
  if (!SETTLED.has(state)) return;
  if (!(bag.runPicked.has(path) || (was && was !== state))) return;
  bag.runPicked.delete(path);
  if (bag.selected.delete(path)) onChange();
}

function renderFiles() {
  const list = $("fileList");
  S.rows.clear();
  list.innerHTML = "";

  // Jobs that are not part of the current scan (e.g. started from another
  // folder) still deserve a row; append them after the scanned files.
  const paths = S.files.map((f) => f.path);
  const known = new Set(paths);
  const extras = [];
  S.jobs.forEach((it, p) => { if (!known.has(p)) extras.push(it); });

  const total = paths.length + extras.length;
  S.total = total;
  paintFileEmpty();
  list.hidden = total === 0;

  for (const f of S.files) list.appendChild(buildRow(f.path, f.name, f.size, f.state === "done", f.output));
  for (const it of extras) list.appendChild(buildRow(it.path, it.name, 0, false, ""));

  updateSummary();
  updateActionBar();
  // Rows rebuilt under an open picker come back without its marks on them.
  if (S.pick.on) paintPick();
}

// paintFileEmpty picks between the two things an empty list can mean. A scan
// of a big folder takes seconds, and for all of them the list is bare — but
// the folder is not, and the difference matters to whoever is waiting.
function paintFileEmpty() {
  const waiting = S.scanning && S.total === 0;
  $("fileScanning").hidden = !waiting;
  $("fileEmpty").hidden = waiting || S.total > 0;
}

function buildRow(path, name, size, done, output) {
  const li = document.createElement("li");
  li.className = "item";
  li.dataset.path = path;

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.className = "item-check";
  cb.checked = S.selected.has(path);
  cb.setAttribute("aria-label", name);
  cb.addEventListener("change", () => {
    if (cb.checked) S.selected.add(path); else S.selected.delete(path);
    // While the picker is open the count that matters is the one in its bar,
    // not the list's summary — which is not even on screen.
    if (S.pick.on) paintPick();
    else { updateSummary(); updateActionBar(); }
  });

  const icon = document.createElement("span");
  icon.className = "item-icon";
  icon.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#i-music"/></svg>';

  const main = document.createElement("div");
  main.className = "item-main";

  const nm = document.createElement("div");
  nm.className = "item-name";
  nm.textContent = name;
  nm.title = name;

  const sub = document.createElement("div");
  sub.className = "item-sub";
  const sz = document.createElement("span");
  sz.className = "item-size";
  sz.textContent = size ? fmtBytes(size) : "";
  const st = document.createElement("span");
  st.className = "item-state";
  sub.append(sz, st);

  const pbar = document.createElement("div");
  pbar.className = "pbar";
  pbar.hidden = true;
  const fill = document.createElement("i");
  pbar.appendChild(fill);

  main.append(nm, sub, pbar);

  const tail = document.createElement("div");
  tail.className = "item-tail";
  tail.appendChild(buildModeChip(S.modes, path, (p) => {
    patchRow(p, { size: sizeOf(p) });
    updateSummary();
  }));
  const chip = document.createElement("span");
  chip.className = "chip state-chip";
  chip.hidden = true;
  tail.appendChild(chip);

  li.append(cb, icon, main, tail);
  // Registered before the tap handler below, and the tap handler ignores
  // anything a long press just did, so the finger that opened the picker does
  // not immediately un-pick the row it opened it on.
  rowLongPress(li, () => {
    if (S.running) return;
    enterPick(path);
  });
  li.addEventListener("click", (ev) => {
    if (!S.pick.on || S.running) return;
    if (ev.target.closest("button, input, a, select")) return;
    if (Date.now() - S.pick.firedAt < 400) return;
    togglePick(path);
    updateSummary();
  });
  rowDoubleClick(li, () => {
    if (S.running || S.pick.on) return;
    nextMode(S.modes, path);
    patchRow(path, { size: sizeOf(path) });
    updateSummary();
  });
  S.rows.set(path, li);
  patchRow(path, { size, done, output });
  return li;
}

// sizeOf is what a patch needs to know about a scanned file, which is only ever
// its size and whether it is already done.
function sizeOf(path) {
  const f = S.files.find((x) => x.path === path);
  return f ? f.size : 0;
}

// patchRow updates only the parts of a row that changed, so a fast stream of
// progress events never rebuilds the list or steals focus.
function patchRow(path, info) {
  const li = S.rows.get(path);
  if (!li) return;

  const job = jobFor(path);
  const cb = li.querySelector(".item-check");
  const sizeEl = li.querySelector(".item-size");
  const stateEl = li.querySelector(".item-state");
  const bar = li.querySelector(".pbar");
  const fill = bar.firstElementChild;
  const chip = li.querySelector(".state-chip");

  paintModeChip(li.querySelector(".modechip"), S.modes, path, S.running);

  const state = job ? job.state : (info.done ? "done" : "new");
  const was = li.dataset.state;
  li.dataset.state = state;

  // A row the batch has settled has nothing left to queue: leaving it ticked
  // means the next batch runs it again, which is a second decryption of a file
  // that is already done. It happens the moment the row finishes rather than
  // when the whole batch does, because a long batch with every finished row
  // still ticked reads as if nothing has happened yet.
  let letGo = false;
  settlePick(S, path, was, job ? state : "", () => { letGo = true; });
  if (letGo) {
    cb.checked = false;
    if (S.pick.on) li.classList.remove("picked");
    updateSummary();
    updateActionBar();
  }

  // Past that, selection is owned by renderFiles and the change handler; a
  // patch never re-derives it. A row the size filter left out cannot be picked
  // at all: the server would refuse the paths as surely as it left them out of
  // the listing, and a tick that does nothing is worse than no tick.
  cb.disabled = S.running || !!info.skipped;

  if (info.size) sizeEl.textContent = fmtBytes(info.size);

  let stageText = "";
  if (job) {
    if (job.state === "running") stageText = t("stage." + (job.stage || "start"));
    else if (job.state === "failed") stageText = job.error || t("state.failed");
    else if (job.state === "done") stageText = t("state.done");
    else if (job.state === "skipped") stageText = t("state.skipped");
    else stageText = t("state.pending");
  } else if (info.done) {
    stageText = t("state.exists");
  } else if (info.skipped) {
    // Why this file is here and not offered. The server names the threshold,
    // so the row and the settings cannot describe it differently.
    stageText = info.skipped;
  }
  if (job && job.state === "done" && job.lyrics && job.lyrics !== "ok") {
    stageText += " · " + t("lyrics." + job.lyrics);
  }
  // A source file that was deleted on the way out says so: the row is about to
  // disappear from the next scan, and a file that vanishes without a word looks
  // like something went wrong.
  if (job && job.removed) stageText += " · " + t("run.removed");
  stateEl.textContent = stageText ? " · " + stageText : "";

  // Progress bar only while there is progress to show.
  if (job && job.state === "running" && job.total > 0) {
    bar.hidden = false;
    fill.style.width = Math.min(100, (job.done / job.total) * 100).toFixed(1) + "%";
  } else {
    bar.hidden = true;
  }

  // Status chip.
  chip.className = "chip state-chip";
  chip.hidden = false;
  switch (state) {
    case "running":
      chip.textContent = t("state.running");
      chip.classList.add("chip-run");
      break;
    case "done":
      chip.textContent = t("state.done");
      chip.classList.add("chip-ok");
      break;
    case "failed":
      chip.textContent = t("state.failed");
      chip.classList.add("chip-err");
      break;
    case "skipped":
      chip.textContent = t("state.skipped");
      chip.classList.add("chip-warn");
      break;
    default:
      if (info.skipped) {
        // Under the minimum: a warning rather than the quiet "pending" chip,
        // because the row is not waiting for anything — it is being held back.
        chip.textContent = info.skipped;
        chip.classList.add("chip-warn");
      } else {
        chip.textContent = t("state.pending");
        chip.hidden = true;
      }
  }

  // Row actions: download the audio, and the .lrc when one exists.
  let actions = li.querySelector(".row-actions");
  if (state === "done" && (job ? job.output : info.output)) {
    const out = (job && job.output) || info.output;
    if (!actions) {
      actions = document.createElement("div");
      actions.className = "row-actions";
      li.querySelector(".item-tail").appendChild(actions);
    }
    actions.innerHTML = "";
    actions.appendChild(coverBtn(out));
    actions.appendChild(linkBtn("i-download", t("files.download"), "/api/download?path=" + encodeURIComponent(out)));
    const lrc = job && job.lrc;
    if (lrc) {
      actions.appendChild(linkBtn("i-file-text", t("run.showLrc"), "/api/download?path=" + encodeURIComponent(lrc)));
    }
  } else if (actions) {
    actions.remove();
  }
}

function coverBtn(path) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "iconbtn";
  b.title = t("cover.open");
  b.setAttribute("aria-label", t("cover.open"));
  b.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#i-image"/></svg>';
  b.addEventListener("click", () => cover.open(path));
  return b;
}

function linkBtn(icon, label, href) {
  const a = document.createElement("a");
  a.className = "iconbtn";
  a.href = href;
  a.title = label;
  a.setAttribute("aria-label", label);
  a.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#' + icon + '"/></svg>';
  return a;
}

function updateSummary() {
  const n = S.files.length;
  const done = S.files.filter((f) => f.state === "done").length;
  const sel = S.selected.size;
  let text;
  if (n === 0 && S.jobs.size === 0) text = "";
  else if (done > 0) text = t("source.foundNew", { n: n - done, done: done });
  else text = t("source.found", { n: n });
  if (sel > 0) text += " · " + t("source.selected", { n: sel });
  $("fileSummary").textContent = text;
}

function updateActionBar() {
  const sel = S.selected.size;
  // While the picker is open the same ticks mean "delete these", so the run
  // button is not offered: it would start a conversion of exactly the files
  // the delete button beside it is about to remove.
  $("startBtn").disabled = S.running || sel === 0 || S.pick.on;
  $("startBtn").hidden = S.running;
  $("stopBtn").hidden = !S.running;
  $("scanBtn").disabled = S.running || S.pick.on;
  $("selAll").disabled = S.running;
  $("selNone").disabled = S.running;
  $("selNew").disabled = S.running;
  $("pickEnter").disabled = S.running || S.rows.size === 0;
}

function renderRunBar() {
  const bar = $("runBar");
  const count = $("runCount");
  const stage = $("runStage");

  if (!S.running && S.batch.total === 0) {
    count.textContent = t("source.selected", { n: S.selected.size });
    stage.textContent = "";
    bar.hidden = true;
    return;
  }

  count.textContent = t("run.summary", { done: S.batch.done, total: S.batch.total });
  bar.hidden = false;
  const pct = S.batch.total ? (S.batch.done / S.batch.total) * 100 : 0;
  $("runFill").style.width = pct.toFixed(1) + "%";

  if (S.running) {
    const active = [];
    S.jobs.forEach((it) => { if (it.state === "running") active.push(it); });
    if (active.length) {
      stage.textContent = active
        .map((it) => it.name + " · " + t("stage." + (it.stage || "start")))
        .join("   ");
    } else {
      stage.textContent = t("run.running");
    }
  } else {
    stage.textContent = "";
  }
}

/* ── Batched DOM updates ────────────────────────────────────────────────── */
const dirty = new Set();
let rafId = 0;
function markDirty(path) {
  dirty.add(path);
  if (!rafId) rafId = requestAnimationFrame(flushDirty);
}
function flushDirty() {
  rafId = 0;
  dirty.forEach((p) => {
    const f = S.files.find((x) => x.path === p);
    patchRow(p, { size: f ? f.size : 0, done: f ? f.state === "done" : false, output: f ? f.output : "" });
  });
  dirty.clear();
  updateSummary();
  renderRunBar();
}

/* ── Scanning ───────────────────────────────────────────────────────────── */
async function scan() {
  const dir = $("srcDir").value.trim();
  if (!dir) return;
  const btn = $("scanBtn");
  const label = btn.querySelector("span");
  const prev = label.textContent;
  btn.disabled = true;
  label.textContent = t("source.scanning");
  S.scanning = true;
  paintFileEmpty();
  try {
    const recursive = $("recursive").checked ? "1" : "0";
    const files = await api("/api/files?dir=" + encodeURIComponent(dir) + "&recursive=" + recursive);
    S.files = files;
    S.selected.clear();
    // A row the size filter left out is not ticked: converting it is exactly
    // what the setting says not to do.
    for (const f of files) if (f.state !== "done" && !f.skipped) S.selected.add(f.path);
    if (S.cfg.dir !== dir) saveConfig({ dir: dir });
    renderFiles();
    if (files.length === 0) toast(t("source.empty"));
  } catch (err) {
    toast(t("source.scanFailed", { msg: err.message }), "err");
  } finally {
    btn.disabled = false;
    label.textContent = prev;
    S.scanning = false;
    paintFileEmpty();
  }
}

$("scanBtn").addEventListener("click", scan);
$("srcDir").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); scan(); } });
$("srcDir").addEventListener("change", () => saveConfig({ dir: $("srcDir").value.trim() }));
$("recursive").addEventListener("change", () => saveUI({ recursive: $("recursive").checked }));
$("selAll").addEventListener("click", () => {
  S.files.forEach((f) => { if (!f.skipped) S.selected.add(f.path); });
  S.rows.forEach((li, p) => { const cb = li.querySelector(".item-check"); if (cb && !cb.disabled) cb.checked = true; });
  updateSummary(); updateActionBar(); renderRunBar();
});
$("selNone").addEventListener("click", () => {
  S.selected.clear();
  S.rows.forEach((li) => { li.querySelector(".item-check").checked = false; });
  updateSummary(); updateActionBar(); renderRunBar();
});
$("selNew").addEventListener("click", () => {
  S.selected.clear();
  S.files.forEach((f) => { if (f.state !== "done" && !f.skipped) S.selected.add(f.path); });
  S.rows.forEach((li, p) => { li.querySelector(".item-check").checked = S.selected.has(p); });
  updateSummary(); updateActionBar(); renderRunBar();
});

$("startBtn").addEventListener("click", async () => {

/* ── Upload ─────────────────────────────────────────────────────────────── */
const drop = $("drop");
let dragDepth = 0;

function dragHasFiles(e) {
  const dt = e.dataTransfer;
  if (!dt) return false;
  if (dt.types) {
    for (const ty of dt.types) if (ty === "Files") return true;
  }
  return false;
}

window.addEventListener("dragenter", (e) => {
  if (!dragHasFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  drop.dataset.active = "true";
});
window.addEventListener("dragover", (e) => {
  if (!dragHasFiles(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
});
window.addEventListener("dragleave", (e) => {
  if (!dragHasFiles(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) drop.dataset.active = "false";
});
window.addEventListener("drop", (e) => {
  if (!dragHasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  drop.dataset.active = "false";
  upload(Array.from(e.dataTransfer.files || []));
});

drop.addEventListener("click", () => $("filepick").click());
drop.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("filepick").click(); }
});
$("filepick").addEventListener("change", () => {
  upload(Array.from($("filepick").files || []));
  $("filepick").value = "";
});

function upload(files) {
  const ncm = files.filter((f) => /\.ncm$/i.test(f.name));
  const skipped = files.length - ncm.length;
  if (!ncm.length) {
    toast(skipped ? t("drop.rejected", { n: skipped }) : t("drop.failed", { msg: t("common.unknownError") }), "err");
    return;
  }

  const fd = new FormData();
  ncm.forEach((f) => fd.append("files", f, f.name));

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload");
  drop.dataset.busy = "true";
  $("uploadbar").hidden = false;
  $("uploadfill").style.width = "0%";
  toast(t("drop.uploading", { n: ncm.length }));

  xhr.upload.addEventListener("progress", (e) => {
    if (e.lengthComputable) {
      $("uploadfill").style.width = ((e.loaded / e.total) * 100).toFixed(1) + "%";
    }
  });

  const done = (ok, msg) => {
    drop.dataset.busy = "false";
    $("uploadbar").hidden = true;
    if (ok) {
      toast(t("drop.uploaded", { n: ncm.length }));
      if (skipped) toast(t("drop.rejected", { n: skipped }));
      scan();
    } else {
      toast(t("drop.failed", { msg: msg }), "err");
    }
  };

  xhr.addEventListener("load", () => {
    if (xhr.status >= 200 && xhr.status < 300) { done(true); return; }
    let msg = "HTTP " + xhr.status;
    try { msg = JSON.parse(xhr.responseText).error || msg; } catch (_) {}
    done(false, msg);
  });
  xhr.addEventListener("error", () => done(false, "network"));
  xhr.addEventListener("abort", () => done(false, "aborted"));
  xhr.send(fd);
}

/* ── File browser ───────────────────────────────────────────────────────── */
async function loadDir(path) {
  try {
    const r = await api("/api/browse?path=" + encodeURIComponent(path || ""));
    S.browse = { path: r.path, parent: r.parent, entries: r.entries || [], roots: r.roots || [] };
    renderBrowser();
  } catch (err) {
    toast(t("files.readFailed", { msg: err.message }), "err");
  }
}

function renderBrowser() {
  const { path, parent, entries, roots } = S.browse;

  // Breadcrumb: cumulative segments from the root.
  const crumbs = $("crumbs");
  crumbs.innerHTML = "";
  const parts = String(path || "").split("/").filter(Boolean);
  let acc = "";
  const rootBtn = document.createElement("button");
  rootBtn.type = "button";
  rootBtn.className = "crumb";
  rootBtn.textContent = "/";
  rootBtn.addEventListener("click", () => loadDir("/"));
  crumbs.appendChild(rootBtn);

  parts.forEach((part, i) => {
    acc += "/" + part;
    const sep = document.createElement("span");
    sep.className = "crumb-sep";
    sep.textContent = "›";
    sep.setAttribute("aria-hidden", "true");
    crumbs.appendChild(sep);

    const b = document.createElement("button");
    b.type = "button";
    b.className = "crumb";
    b.textContent = part;
    if (i === parts.length - 1) b.setAttribute("aria-current", "page");
    else b.addEventListener("click", () => loadDir(acc));
    crumbs.appendChild(b);
  });

  const rootBox = $("roots");
  rootBox.innerHTML = "";
  for (const r of roots) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "rootchip";
    if (r.path === path) b.dataset.current = "true";
    b.textContent = t("files.root." + r.name) || r.name;
    b.title = r.path;
    b.addEventListener("click", () => loadDir(r.path));
    rootBox.appendChild(b);
  }

  $("upBtn").disabled = !parent;

  const list = $("browseList");
  list.innerHTML = "";
  $("browseEmpty").hidden = entries.length > 0;
  list.hidden = entries.length === 0;

  for (const e of entries) list.appendChild(buildBrowseRow(e));
}

function buildBrowseRow(e) {
  const li = document.createElement("li");
  li.className = "browse-item";

  const open = document.createElement("button");
  open.type = "button";
  open.className = "browse-open";

  const icon = document.createElement("span");
  icon.className = "browse-icon " + (e.isDir ? "dir" : "file");
  icon.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#' +
    (e.isDir ? "i-folder" : (e.name === ".." ? "i-up" : "i-file")) + '"/></svg>';

  const main = document.createElement("div");
  main.className = "item-main";
  const nm = document.createElement("div");
  nm.className = "browse-name";
  nm.textContent = e.name;
  nm.title = e.name;
  const meta = document.createElement("div");
  meta.className = "browse-meta";
  meta.textContent = e.isDir
    ? fmtDate(e.modTime)
    : fmtBytes(e.size) + (e.modTime ? " · " + fmtDate(e.modTime) : "");
  main.append(nm, meta);

  open.append(icon, main);
  open.addEventListener("click", () => {
    if (e.isDir) loadDir(e.path);
    else window.location.href = "/api/download?path=" + encodeURIComponent(e.path);
  });

  const tail = document.createElement("div");
  tail.className = "item-tail";

  if (!e.isDir) {
    // Only the containers the cover editor knows how to rewrite; offering it
    // on anything else would just produce an error.
    if (/\.(flac|mp3)$/i.test(e.name)) tail.appendChild(coverBtn(e.path));
    const dl = linkBtn("i-download", t("files.download"), "/api/download?path=" + encodeURIComponent(e.path));
    tail.appendChild(dl);
  }

  const rn = document.createElement("button");
  rn.type = "button";
  rn.className = "iconbtn";
  rn.title = t("common.rename");
  rn.setAttribute("aria-label", t("common.rename"));
  rn.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#i-pencil"/></svg>';
  rn.addEventListener("click", () => renameEntry(e));
  tail.appendChild(rn);

  const del = document.createElement("button");
  del.type = "button";
  del.className = "iconbtn danger";
  del.title = t("common.delete");
  del.setAttribute("aria-label", t("common.delete"));
  del.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#i-trash"/></svg>';
  del.addEventListener("click", () => deleteEntries([e]));
  tail.appendChild(del);

  li.append(open, tail);
  return li;
}

async function renameEntry(e) {
  const name = await askText({
    title: t("common.rename"),
    label: t("files.renamePrompt"),
    value: e.name,
  });
  if (!name || name === e.name) return;
  if (name.includes("/")) { toast(t("files.renameFailed", { msg: "invalid name" }), "err"); return; }
  const dir = S.browse.path.replace(/\/+$/, "");
  try {
    await post("/api/rename", { from: e.path, to: dir + "/" + name });
    loadDir(S.browse.path);
  } catch (err) {
    toast(t("files.renameFailed", { msg: err.message }), "err");
  }
}

async function deleteEntries(entries) {
  const body = entries.length === 1
    ? t("files.deleteOne", { name: entries[0].name })
    : t("files.deleteMany", { n: entries.length });
  const ok = await askConfirm({
    title: t("common.delete"),
    body: body,
    danger: true,
    confirmText: t("common.delete"),
  });
  if (!ok) return;
  try {
    const r = await post("/api/delete", { paths: entries.map((e) => e.path) });
    if (r.errors && r.errors.length) {
      toast(t("files.deletePartial", { n: r.deleted, fail: r.errors.length }), "err");
    } else {
      toast(t("files.deleted", { n: r.deleted }));
    }
    loadDir(S.browse.path);
  } catch (err) {
    toast(err.message, "err");
  }
}

$("upBtn").addEventListener("click", () => { if (S.browse.parent) loadDir(S.browse.parent); });
$("refreshBtn").addEventListener("click", () => loadDir(S.browse.path));
$("mkdirBtn").addEventListener("click", async () => {

  const dir = S.browse.path.replace(/\/+$/, "");

/* ── Folder picker ──────────────────────────────────────────────────────── */
// A modal browser rather than a jump to the Files tab: the setup screen covers
// the tabs, and bouncing someone to another page to answer a question asked in
// a dialog loses their place.
const picker = {
  path: "",
  dirs: [],
  resolve: null,

  // open resolves with the chosen folder, or null if it was dismissed.
  open(start) {
    const dlg = $("picker");
    return new Promise((resolve) => {
      this.resolve = resolve;
      this.renderRecent();
      if (!dlg.open) dlg.showModal();
      this.load(start);
    });
  },

  finish(value) {
    const resolve = this.resolve;
    this.resolve = null;
    const dlg = $("picker");
    if (dlg.open) dlg.close();
    if (resolve) resolve(value);
  },

  async load(path) {
    try {
      const r = await api("/api/browse?path=" + encodeURIComponent(path || ""));
      this.path = r.path;
      this.dirs = (r.entries || []).filter((e) => e.isDir && e.name !== "..");
      this.roots = r.roots || [];
      this.render();
    } catch (err) {
      toast(t("files.readFailed", { msg: err.message }), "err");
    }
  },

  render() {
    $("pickerPath").textContent = this.path;

    const crumbs = $("pickerCrumbs");
    crumbs.innerHTML = "";
    const crumb = (label, target, current) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "crumb";
      b.textContent = label;
      if (current) b.setAttribute("aria-current", "page");
      else b.addEventListener("click", () => this.load(target));
      return b;
    };
    const parts = String(this.path || "").split("/").filter(Boolean);
    let acc = "";
    crumbs.appendChild(crumb("/", "/", parts.length === 0));
    parts.forEach((part, i) => {
      acc += "/" + part;
      const sep = document.createElement("span");
      sep.className = "crumb-sep";
      sep.textContent = "›";
      sep.setAttribute("aria-hidden", "true");
      crumbs.appendChild(sep);
      crumbs.appendChild(crumb(part, acc, i === parts.length - 1));
    });

    const roots = $("pickerRootsRow");
    roots.innerHTML = "";
    const places = this.roots || [];
    $("pickerRoots").hidden = places.length === 0;
    for (const r of places) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "rootchip";
      b.textContent = t("files.root." + r.name) || r.name;
      b.title = r.path;
      b.addEventListener("click", () => this.load(r.path));
      roots.appendChild(b);
    }

    const list = $("pickerList");
    list.innerHTML = "";
    for (const d of this.dirs) {
      const li = document.createElement("li");
      li.className = "browse-item";
      const open = document.createElement("button");
      open.type = "button";
      open.className = "browse-open";
      open.innerHTML = '<span class="browse-icon dir">' +
        '<svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg></span>';
      const nm = document.createElement("div");
      nm.className = "browse-name";
      nm.textContent = d.name;
      open.appendChild(nm);
      open.addEventListener("click", () => this.load(d.path));
      li.appendChild(open);
      list.appendChild(li);
    }
    $("pickerEmpty").hidden = this.dirs.length > 0;

    this.renderRecent();
  },

  renderRecent() {
    const row = $("pickerRecentRow");
    const recent = (loadUI().recent || []).filter((p) => p && p !== this.path);
    row.innerHTML = "";
    $("pickerRecent").hidden = recent.length === 0;
    for (const p of recent) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "rootchip";
      b.textContent = baseName(p) || p;
      b.title = p;
      b.addEventListener("click", () => this.load(p));
      row.appendChild(b);
    }
  },
};

$("picker").addEventListener("close", () => picker.finish(null));
$("pickerCancel").addEventListener("click", () => picker.finish(null));
$("pickerClose").addEventListener("click", () => picker.finish(null));
$("pickerUse").addEventListener("click", () => picker.finish(picker.path));

const chooseDir = (start) => picker.open(start);

/* ── Directory cards ────────────────────────────────────────────────────── */
// The three folders, on the page people actually land on. The scan one is
// first because it is the one that changes most often.
const DIR_CARDS = [
  { key: "scan", icon: "i-search", field: "dir", get: () => S.cfg.dir },
  { key: "output", icon: "i-download", field: "output", get: () => S.cfg.output },
  { key: "workspace", icon: "i-hard-drive", field: "workspace", get: () => S.cfg.workspace },
];

function renderDirCards() {
  const box = $("dirChips");
  box.setAttribute("aria-label", t("dirs.title"));
  box.innerHTML = "";
  for (const card of DIR_CARDS) {
    const value = card.get() || "";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "dircard";
    if (!value) b.dataset.unset = "true";
    b.title = value || t("dirs.unset");
    b.innerHTML =
      '<span class="dircard-icon"><svg class="icon icon-sm" aria-hidden="true"><use href="#' + card.icon + '"/></svg></span>' +
      '<span class="dircard-text"><span class="dircard-label"></span>' +
      '<span class="dircard-value"></span></span>' +
      '<svg class="icon icon-sm dircard-go" aria-hidden="true"><use href="#i-pencil"/></svg>';
    b.querySelector(".dircard-label").textContent = t("dirs." + card.key);
    b.querySelector(".dircard-value").textContent = value || t("dirs.unset");
    b.addEventListener("click", () => editDir(card));
    box.appendChild(b);
  }
}

async function editDir(card) {
  const chosen = await chooseDir(card.get() || S.cfg.dir || S.meta.home);
  if (!chosen || chosen === card.get()) return;
  rememberDir(chosen);

  if (card.key === "scan") {
    // Picking a source folder is a request to look in it, so save and scan
    // together rather than leaving an unread folder sitting in the settings.
    // Saving directly, rather than leaving it to scan(), keeps the card honest
    // even when the scan itself fails.
    $("srcDir").value = chosen;
    saveConfig({ dir: chosen });
    renderDirCards();
    scan();
    return;
  }
  saveConfig({ [card.field]: chosen });
  renderDirCards();
}

/* ── First-run setup ────────────────────────────────────────────────────── */
function showSetup() {
  $("setupScan").value = S.cfg.dir || S.meta.home || "";
  $("setupOut").value = S.cfg.output || "";
  $("setupWork").value = S.cfg.workspace || S.meta.defaultWorkspace || "";
  $("setup").hidden = false;
  document.body.style.overflow = "hidden";
  setTimeout(() => $("setupScan").focus(), 40);
}

function hideSetup() {
  $("setup").hidden = true;
  document.body.style.overflow = "";
}

async function finishSetup() {
  const dir = $("setupScan").value.trim();
  if (!dir) {
    toast(t("setup.needScan"), "err");
    $("setupScan").focus();
    return;
  }
  // An emptied field falls back to what the folder implies rather than to
  // whatever the server happened to be holding.
  const output = $("setupOut").value.trim() || dir.replace(/\/+$/, "") + "/ncm-output";
  const workspace = $("setupWork").value.trim() || S.meta.defaultWorkspace || "";

  const btn = $("setupStart");
  btn.disabled = true;
  try {
    S.cfg = await post("/api/config", {
      dir: dir, output: output, workspace: workspace, initialized: true,
    });
    rememberDir(dir);
    hideSetup();
    syncSettings();
    syncSourceDir();
    renderDirCards();
    scan();
  } catch (err) {
    toast(t("setup.failed", { msg: err.message }), "err");
  } finally {
    btn.disabled = false;
  }
}

$("setupStart").addEventListener("click", finishSetup);
$("setupScanPick").addEventListener("click", async () => {
