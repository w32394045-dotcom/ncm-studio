/* ── Landing mode ───────────────────────────────────────────────────────── */
/* Both lists carry the same control: a chip that says what the next run will
   do with this one file, and that changes it when tapped. The value is the
   integer store.LyricsMode uses on the server, and an absent override means
   "whatever the setting says" — which is why the map, not the number, is what
   the page sends. */
/* The four modes are the same four numbers on both pages, but the two pages
   are not asking the same question. The conversion page is about what comes
   out of a .ncm, so its chip names the music first — "music", "music +
   lyrics"; the lyrics page is about fetching words for a file that is already
   there, so its chip names what happens to the words. Reading the same words
   on both pages is what made the conversion page look like the lyrics page. */
const MUSIC_MODE_KEYS = ["mode.music", "mode.musicLyrics", "mode.musicLyricsLrc", "mode.musicLrc"];
const LYRIC_MODE_KEYS = ["settings.lyricsOff", "settings.lyricsEmbed", "settings.lyricsBoth", "settings.lyricsFile"];
// default → embed → embed+sidecar → sidecar only → off → default.
const MODE_CYCLE = [null, 1, 2, 3, 0];

function clampMode(n) {
  return MUSIC_MODE_KEYS[n] ? n : 0;
}

function effectiveMode(overrides, path) {
  const o = overrides.get(path);
  return o === undefined ? clampMode(Number(S.cfg.lyrics)) : clampMode(o);
}

function nextMode(overrides, path) {
  const cur = overrides.has(path) ? overrides.get(path) : null;
  const next = MODE_CYCLE[(MODE_CYCLE.indexOf(cur) + 1) % MODE_CYCLE.length];
  if (next === null) overrides.delete(path);
  else overrides.set(path, next);
  return next;
}

function modeLabel(mode, keys) {
  return t((keys || MUSIC_MODE_KEYS)[clampMode(mode)]);
}

// A chip carries its own wording: paintModeChip is called again later from the
// row patches, which know the element and nothing else.
function paintModeChip(b, overrides, path, disabled, keys) {
  if (!b) return;
  if (keys) b._modeKeys = keys;
  const set = b._modeKeys || MUSIC_MODE_KEYS;
  const mode = effectiveMode(overrides, path);
  const own = overrides.has(path);
  b.dataset.mode = String(mode);
  if (own) b.dataset.override = "true";
  else delete b.dataset.override;
  b.textContent = modeLabel(mode, set);
  const title = own
    ? t("lyrics.modeOverride", { mode: modeLabel(mode, set) })
    : t("lyrics.modeDefault", { mode: modeLabel(mode, set) });
  b.title = title;
  b.setAttribute("aria-label", title);
  b.disabled = !!disabled;
}

function buildModeChip(overrides, path, onChange, keys) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip modechip";
  b.addEventListener("click", (ev) => {
    ev.stopPropagation();
    if (b.disabled) return;
    nextMode(overrides, path);
    onChange(path);
  });
  paintModeChip(b, overrides, path, false, keys);
  return b;
}

// A double-click anywhere on a row does what the chip does, which is the
// gesture the list was asked for; the chip is there because a touch screen has
// no double-click and because a control has to be reachable by keyboard.
function rowDoubleClick(li, onCycle) {
  li.addEventListener("dblclick", (ev) => {
    if (ev.target.closest("button, input, a, select")) return;
    onCycle();
  });
}

// A long press is what a phone expects for "start picking things", and it has
// to survive a list that scrolls under the finger: the timer is dropped the
// moment the pointer moves far enough to be a scroll. Right-click counts too,
// because a mouse has no long press — and the browser's own menu is suppressed
// either way, since on a touch screen it arrives right after this one fires.
function rowLongPress(li, onLong) {
  let timer = 0, x0 = 0, y0 = 0;
  const cancel = () => { clearTimeout(timer); timer = 0; };
  li.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest("button, input, a, select")) return;
    if (ev.pointerType === "mouse" && ev.button !== 0) return;
    x0 = ev.clientX; y0 = ev.clientY;
    cancel();
    timer = setTimeout(() => { timer = 0; S.pick.firedAt = Date.now(); onLong(); }, 480);
  });
  li.addEventListener("pointermove", (ev) => {
    if (!timer) return;
    if (Math.abs(ev.clientX - x0) > 10 || Math.abs(ev.clientY - y0) > 10) cancel();
  });
  li.addEventListener("pointerup", cancel);
  li.addEventListener("pointercancel", cancel);
  li.addEventListener("pointerleave", cancel);
  li.addEventListener("contextmenu", (ev) => {
    if (ev.target.closest("button, input, a, select")) return;
    ev.preventDefault();
    if (!S.pick.on) { S.pick.firedAt = Date.now(); onLong(); }
  });
}

/* ── Deleting rows ──────────────────────────────────────────────────────── */
/* A long press turns the list into a picker. It is not a second selection of
   its own — it is the same checkboxes the batch uses — so entering it takes a
   copy of what was ticked and leaving it without deleting puts that copy back.
   The picker starts on the row that was pressed, not on whatever was ticked
   for a conversion: deleting the files someone queued for decryption because
   they happened to be ticked is the one mistake this mode must not make. */

function enterPick(path) {
  if (S.pick.on || S.running) return;
  S.pick.on = true;
  S.pick.snapshot = new Set(S.selected);
  S.selected = new Set(path ? [path] : []);
  paintPick();
}

function exitPick(restore) {
  if (!S.pick.on) return;
  S.pick.on = false;
  if (restore && S.pick.snapshot) S.selected = new Set(S.pick.snapshot);
  S.pick.snapshot = null;
  paintPick();
}

function togglePick(path) {
  if (S.selected.has(path)) S.selected.delete(path);
  else S.selected.add(path);
  paintPick();
}

// paintPick redraws the bar and pushes the selection back into the checkboxes,
// because a row may have been rebuilt since the picker opened.
function paintPick() {
  const on = S.pick.on;
  const list = $("fileList");
  $("pickBar").hidden = !on;
  $("fileHead").hidden = on;
  if (on) list.dataset.picking = "true";
  else delete list.dataset.picking;
  if (on) $("pickCount").textContent = t("source.selected", { n: S.selected.size });
  S.rows.forEach((li, p) => {
    const picked = S.selected.has(p);
    li.classList.toggle("picked", on && picked);
    const cb = li.querySelector(".item-check");
    // Written even as the bar goes away: leaving the picker puts back the
    // selection it snapshotted, and a tick left where the picker put it would
    // describe a batch nobody queued.
    if (cb) {
      cb.checked = picked;
      if (on) cb.disabled = false;
    }
  });
  updateActionBar();
}

async function deletePicked() {
  const paths = Array.from(S.selected);
  if (!paths.length) { toast(t("pick.nothing"), "err"); return; }
  const size = S.files.reduce((n, f) => n + (S.selected.has(f.path) ? f.size || 0 : 0), 0);
  const ok = await askConfirm({
    title: t("pick.title"),
    body: t("pick.body", { n: paths.length, size: fmtBytes(size) || "—" }),
    danger: true,
    confirmText: t("common.delete"),
  });
  if (!ok) return;
  const went = await deleteFiles(paths);
  // Cleared before the bar is repainted, so the buttons go by what is left
  // rather than by the paths that were just removed.
  S.selected = new Set();
  exitPick(false);
  if (went) scan();
}

// deleteFiles removes the given paths and says whether the list still describes
// what is on disk, which decides whether it has to be scanned again.
async function deleteFiles(paths) {
  try {
    const r = await post("/api/delete", { paths: paths });
    if (r.errors && r.errors.length) {
      toast(t("files.deletePartial", { n: r.deleted, fail: r.errors.length }), "err");
    } else {
      toast(t("pick.deleted", { n: r.deleted }));
    }
    // The rows have to go with the files: a job for a path that no longer
    // exists would come back as a row with a download button that cannot work.
    paths.forEach((p) => { S.jobs.delete(p); S.rows.delete(p); S.modes.delete(p); });
    return true;
  } catch (err) {
    toast(err.message, "err");
    return false;
  }
}

/* ── Lyrics page ────────────────────────────────────────────────────────── */
const L = {
  items: [],
  byPath: new Map(),
  rows: new Map(),      // path -> <li>
  jobs: new Map(),      // path -> job item, from the lyrics stream
  selected: new Set(),
  runPicked: new Set(), // what the running batch was queued with; see settlePick
  modes: new Map(),     // path -> landing override; absent means "the setting"
  matches: new Map(),   // path -> the candidates a manual search returned
  busy: new Set(),      // paths with a search or a write in flight
  running: false,
  batch: { total: 0, done: 0 },
  loaded: false,
};

// The reasons are constants in the matcher, so they can name a translation.
// Anything unrecognised is shown as it arrived: a reason this page has not
// been taught is still better than no reason at all.
const REASON_KEYS = {
  "nothing in the name or tags to search for": "nothing",
  "no search result looked like this file": "noCandidate",
  "no candidate shares a title with this file": "noCandidate",
  "looks like a backing track": "instrumental",
  "version suffix does not match": "suffix",
  "title only partially matches": "partialTitle",
  "artists do not match": "artists",
  "not enough agrees to be sure": "unsure",
  "another version scored the same": "tie",
  "lyrics are off for this file": "off",
  "this track has no lyrics": "noLyrics",
  // The .lrc page's refusals.
  "this file has no lyrics to write out": "noLyricsOut",
  "a .lrc is already there and it was not to be replaced": "lrcExists",
  "no .lrc beside this file to read": "noLrc",
  "the .lrc holds no timed lines": "lrcNoLines",
  "this file already has lyrics and it was not to be replaced": "lyricsKept",
  // The translation page's.
  "lyrics are off in the settings, so there is nowhere to put a translation": "lyricsOff",
  "no target language is set": "noTarget",
  "this file has no lyrics to translate": "nothingToTranslate",
  "this file already carries a machine translation": "alreadyTranslated",
};

// The key reason names the provider it is missing, so it cannot be a table
// entry; everything else is a constant on the other side.
const NO_KEY_REASON = "no API key is stored for ";

function reasonText(reason) {
  if (!reason) return "";
  const suffix = REASON_KEYS[reason];
  if (suffix) return t("reason." + suffix);
  if (reason.startsWith(NO_KEY_REASON)) {
    return t("reason.noKey", { provider: reason.slice(NO_KEY_REASON.length) });
  }
  return reason;
}

function lyricFacts(e) {
  const lead = (e.artists || []).join(", ");
  return [lead, e.title, e.size ? fmtBytes(e.size) : ""].filter(Boolean).join(" · ");
}

async function scanLyrics() {
  const dir = $("lyricDir").value.trim() || S.cfg.dir;
  if (!dir) return;
  const btn = $("lyricScanBtn");
  const label = btn.querySelector("span");
  const prev = label.textContent;
  btn.disabled = true;
  label.textContent = t("source.scanning");
  L.scanning = true;
  paintLyricEmpty();
  try {
    const recursive = $("lyricRecursive").checked ? "1" : "0";
    const items = await api("/api/audio?dir=" + encodeURIComponent(dir) + "&recursive=" + recursive);
    L.items = items;
    L.byPath = new Map(items.map((e) => [e.path, e]));
    L.loaded = true;
    if (S.cfg.dir !== dir) saveConfig({ dir: dir });
    // What still needs lyrics is selected; what already has them stays out of
    // the way until it is asked for by hand.
    L.selected = new Set(items.filter((e) => e.writable && !e.hasLyrics).map((e) => e.path));
    renderLyrics();
    if (!items.length) toast(t("lyrics.empty"));
  } catch (err) {
    toast(t("source.scanFailed", { msg: err.message }), "err");
  } finally {
    btn.disabled = false;
    label.textContent = prev;
    L.scanning = false;
    paintLyricEmpty();
  }
}

// The lyrics list's half of the same rule; see paintFileEmpty.
function paintLyricEmpty() {
  const waiting = L.scanning && L.total === 0;
  $("lyricScanning").hidden = !waiting;
  $("lyricEmpty").hidden = waiting || L.total > 0;
}

function renderLyrics() {
  const list = $("lyricList");
  L.rows.clear();
  list.innerHTML = "";

  // A batch may have touched files outside the current folder; those rows are
  // kept so a decision waiting on a person cannot be lost by navigating away.
  const known = new Set(L.items.map((e) => e.path));
  const extras = [];
  L.jobs.forEach((it, p) => { if (!known.has(p)) extras.push(it); });

  const total = L.items.length + extras.length;
  L.total = total;
  paintLyricEmpty();
  list.hidden = total === 0;

  for (const e of L.items) list.appendChild(buildLyricRow(e));
  for (const it of extras) {
    list.appendChild(buildLyricRow({
      path: it.path, name: it.name, size: 0, writable: true, hasLyrics: it.hasLyrics,
    }));
  }
  updateLyricSummary();
  updateLyricBar();
}

function buildLyricRow(e) {
  const li = document.createElement("li");
  li.className = "item";
  li.dataset.path = e.path;

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.className = "item-check";
  cb.checked = L.selected.has(e.path);
  cb.setAttribute("aria-label", e.name);
  cb.addEventListener("change", () => {
    if (cb.checked) L.selected.add(e.path);
    else L.selected.delete(e.path);
    updateLyricSummary();
    updateLyricBar();
  });

  const icon = document.createElement("span");
  icon.className = "item-icon";
  icon.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#i-music"/></svg>';

  const main = document.createElement("div");
  main.className = "item-main";

  const nm = document.createElement("div");
  nm.className = "item-name";
  nm.textContent = e.name;
  nm.title = e.path;

  const sub = document.createElement("div");
  sub.className = "item-sub";
  const facts = document.createElement("span");
  facts.textContent = lyricFacts(e);
  const st = document.createElement("span");
  st.className = "item-state";
  sub.append(facts, st);

  const pbar = document.createElement("div");
  pbar.className = "pbar";
  pbar.hidden = true;
  pbar.appendChild(document.createElement("i"));

  const cands = document.createElement("div");
  cands.className = "cands";
  cands.hidden = true;

  main.append(nm, sub, pbar, cands);

  const tail = document.createElement("div");
  tail.className = "item-tail";
  tail.appendChild(buildModeChip(L.modes, e.path, (p) => {
    patchLyricRow(p);
    updateLyricSummary();
    updateLyricBar();
  }, LYRIC_MODE_KEYS));
  const chip = document.createElement("span");
  chip.className = "chip state-chip";
  chip.hidden = true;
  tail.appendChild(chip);

  li.append(cb, icon, main, tail);
  rowDoubleClick(li, () => {
    if (L.running || cb.disabled) return;
    nextMode(L.modes, e.path);
    patchLyricRow(e.path);
    updateLyricSummary();
    updateLyricBar();
  });

  L.rows.set(e.path, li);
  patchLyricRow(e.path);
  return li;
}

function lyricStateText(job, e) {
  if (job) {
    switch (job.state) {
      case "running": return t("stage." + (job.stage || "start"));
      case "done": return job.lyrics === "none" ? t("lyrics.none") : t("lyrics.ok");
      case "failed": return job.error || t("state.failed");
      case "review": return t("state.review");
      case "skipped": return reasonText(job.reason) || t("state.skipped");
      default: return t("state.pending");
    }
  }
  if (e && !e.writable) return t("lyrics.readOnly");
  if (e && e.hasLyrics) return t("lyrics.hasLyrics");
  return t("lyrics.missing");
}

function patchLyricRow(path) {
  const li = L.rows.get(path);
  if (!li) return;
  const e = L.byPath.get(path) || null;
  const job = L.jobs.get(path) || null;
  const writable = !e || e.writable;
  const locked = L.running || !writable;
  const state = job ? job.state : "";
  const was = li.dataset.state;
  li.dataset.state = state;
  if (job && job.state === "review") li.dataset.review = "true";
  else delete li.dataset.review;

  // The same rule finishLyrics applies when the batch ends, applied the moment
  // each row lands: a file that is done, or that was passed over, leaves the
  // selection. Waiting for the batch to end is what left a list of finished
  // files still ticked for the whole of a long run. Failed and review rows stay
  // — those are the ones to run again.
  settlePick(L, path, was, job ? state : "", () => {
    updateLyricSummary();
    updateLyricBar();
  });

  const cb = li.querySelector(".item-check");
  cb.disabled = locked;
  cb.checked = L.selected.has(path);

  paintModeChip(li.querySelector(".modechip"), L.modes, path, locked || L.busy.has(path));

  li.querySelector(".item-state").textContent = " · " + lyricStateText(job, e);

  const bar = li.querySelector(".pbar");
  if (job && job.state === "running" && job.total > 0) {
    bar.hidden = false;
    bar.firstElementChild.style.width = Math.min(100, (job.done / job.total) * 100).toFixed(1) + "%";
  } else {
    bar.hidden = true;
  }

  const chip = li.querySelector(".state-chip");
  chip.className = "chip state-chip";
  chip.hidden = false;
  switch (state) {
    case "running": chip.textContent = t("state.running"); chip.classList.add("chip-run"); break;
    case "done": chip.textContent = t("state.done"); chip.classList.add("chip-ok"); break;
    case "failed": chip.textContent = t("state.failed"); chip.classList.add("chip-err"); break;
    case "review": chip.textContent = t("state.review"); chip.classList.add("chip-warn"); break;
    case "skipped": chip.textContent = t("state.skipped"); chip.classList.add("chip-warn"); break;
    default: chip.textContent = t("state.pending"); chip.hidden = true;
  }

  renderCandidates(li, path);
}

// renderCandidates draws the choice a review row is waiting on. The candidates
// come from the batch (carried back on the item, so a reload still has them) or
// from a manual search, which is the same shape.
function renderCandidates(li, path) {
  const box = li.querySelector(".cands");
  const job = L.jobs.get(path) || null;
  const match = L.matches.get(path) || null;
  const review = !!job && job.state === "review";
  if (!review && !match) {
    box.hidden = true;
    box.innerHTML = "";
    return;
  }

  box.innerHTML = "";
  box.hidden = false;

  const head = document.createElement("div");
  head.className = "cands-head";
  const why = document.createElement("span");
  why.textContent = reasonText((match && match.reason) || (job && job.reason)) || t("state.review");
  head.appendChild(why);
  head.appendChild(document.createElement("span")).className = "spacer";

  if (L.busy.has(path)) {
    const busy = document.createElement("span");
    busy.className = "cand-busy";
    busy.textContent = t("lyrics.searching");
    head.appendChild(busy);
  } else {
    const retry = document.createElement("button");
    retry.type = "button";
    retry.className = "btn btn-sm btn-quiet";
    retry.textContent = t("lyrics.retry");
    retry.disabled = L.running;
    retry.addEventListener("click", () => searchOne(path));
    head.appendChild(retry);
  }
  box.appendChild(head);

  const cands = (match && match.candidates) || (job && job.candidates) || [];
  // A suggestion names its pick in musicId; a batch row has none, because the
  // batch only asks about the ones it could not decide.
  const best = match ? match.musicId : 0;
  if (!cands.length) {
    const none = document.createElement("span");
    none.className = "secnote";
    none.textContent = t("lyrics.noCandidates");
    box.appendChild(none);
    return;
  }
  for (const c of cands) box.appendChild(buildCandidate(path, c, best));
}

function buildCandidate(path, c, best) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "cand";
  b.disabled = L.busy.has(path) || L.running;

  const main = document.createElement("span");
  main.className = "cand-main";
  const nm = document.createElement("span");
  nm.className = "cand-name";
  nm.textContent = c.name || String(c.musicId);
  const sub = document.createElement("span");
  sub.className = "cand-sub";
  const secs = c.durationMs ? Math.round(c.durationMs / 1000) : 0;
  sub.textContent = [
    (c.artists || []).join(", "),
    c.album,
    secs ? Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0") : "",
  ].filter(Boolean).join(" · ");
  main.append(nm, sub);
  b.appendChild(main);

  if (best && c.musicId === best) {
    const tag = document.createElement("span");
    tag.className = "cand-score";
    tag.textContent = t("lyrics.bestMatch");
    b.appendChild(tag);
  }
  if (c.score) {
    const sc = document.createElement("span");
    sc.className = "cand-score";
    sc.textContent = String(c.score);
    b.appendChild(sc);
  }

  b.title = t("lyrics.applyThis", { name: nm.textContent });
  // The whole candidate goes along, not just its id: the names are what a file
  // with no tags of its own gets named with, and this is the moment they are
  // known.
  b.addEventListener("click", () => applyLyric(path, c));
  return b;
}

async function searchOne(path) {
  if (L.busy.has(path)) return;
  L.busy.add(path);
  patchLyricRow(path);
  try {
    L.matches.set(path, await post("/api/lyrics/match", { path: path }));
  } catch (err) {
    toast(t("lyrics.searchFailed", { msg: err.message }), "err");
  } finally {
    L.busy.delete(path);
    patchLyricRow(path);
  }
}

async function applyLyric(path, c) {
  if (L.busy.has(path)) return;
  L.busy.add(path);
  patchLyricRow(path);
  try {
    const out = await post("/api/lyrics/apply", {
      path: path, musicId: c.musicId, name: c.name,
      artists: c.artists, album: c.album,
      mode: effectiveMode(L.modes, path),
    });
    L.matches.delete(path);
    // The row is settled here rather than waiting for the stream: a file that
    // was never part of a batch has no item on the server to be updated, and
    // leaving it in "review" after a successful write would be a lie.
    const prev = L.jobs.get(path) || { id: path, path: path, name: baseName(path) };
    L.jobs.set(path, Object.assign({}, prev, {
      state: "done", musicId: c.musicId, lyrics: out.lyrics || "ok",
      lrc: out.lrc || "", reason: "", candidates: null, error: "",
    }));
    const e = L.byPath.get(path);
    if (e && out.lyrics !== "none") e.hasLyrics = true;
    // "Nothing to do" is a real outcome — the file already holds exactly these
    // lyrics — and saying a file was written when none was would send the user
    // looking for it.
    const what = out.embedded && out.lrc ? "lyrics.appliedBoth"
      : out.embedded ? "lyrics.appliedEmbed"
        : out.lrc ? "lyrics.appliedFile"
          : "lyrics.appliedCurrent";
    toast(t("lyrics.applied", { name: baseName(path), what: t(what) }));
  } catch (err) {
    toast(t("lyrics.applyFailed", { msg: err.message }), "err");
  } finally {
    L.busy.delete(path);
    patchLyricRow(path);
    updateLyricSummary();
  }
}

function lyricCost() {
  let rewrite = 0, bytes = 0, sidecar = 0;
  L.selected.forEach((p) => {
    const mode = effectiveMode(L.modes, p);
    const e = L.byPath.get(p);
    if (mode === 1 || mode === 2) {
      rewrite++;
      bytes += (e && e.size) || 0;
    }
    if (mode === 2 || mode === 3) sidecar++;
  });
  return { rewrite: rewrite, bytes: bytes, sidecar: sidecar };
}

function lyricCostText() {
  const c = lyricCost();
  const parts = [];
  if (c.rewrite) parts.push(t("lyrics.costRewrite", { n: c.rewrite, size: fmtBytes(c.bytes) }));
  if (c.sidecar) parts.push(t("lyrics.costSidecar", { n: c.sidecar }));
  if (!parts.length && L.selected.size) parts.push(t("lyrics.costNone"));
  return parts.join(" · ");
}

function updateLyricSummary() {
  const total = L.items.length;
  const missing = L.items.filter((e) => e.writable && !e.hasLyrics).length;
  const have = L.items.filter((e) => e.hasLyrics).length;
  let text = t("lyrics.found", { n: total, missing: missing });
  if (have) text += " · " + t("lyrics.haveLyrics", { n: have });
  if (L.selected.size) text += " · " + t("source.selected", { n: L.selected.size });
  $("lyricSummary").textContent = text;
}

function updateLyricBar() {
  $("lyricStart").hidden = L.running;
  $("lyricStop").hidden = !L.running;
  $("lyricStart").disabled = L.running || L.selected.size === 0;
  $("lyricScanBtn").disabled = L.running;
  $("lyricSelAll").disabled = L.running;
  $("lyricSelNone").disabled = L.running;
  $("lyricSelMissing").disabled = L.running;

  const bar = $("lyricBar");
  if (!L.running) {
    $("lyricCount").textContent = t("source.selected", { n: L.selected.size });
    $("lyricStage").textContent = lyricCostText();
    bar.hidden = true;
    return;
  }

  $("lyricCount").textContent = t("run.summary", { done: L.batch.done, total: L.batch.total });
  bar.hidden = !L.batch.total;
  $("lyricFill").style.width =
    (L.batch.total ? (L.batch.done / L.batch.total) * 100 : 0).toFixed(1) + "%";

  const active = [];
  L.jobs.forEach((it) => { if (it.state === "running") active.push(it); });
  $("lyricStage").textContent = active.length
    ? active.map((it) => it.name + " · " + t("stage." + (it.stage || "start"))).join("   ")
    : t("run.running");
}

async function startLyrics() {
  const paths = Array.from(L.selected);
  if (!paths.length) { toast(t("run.nothingSelected"), "err"); return; }
  const modes = {};
  for (const p of paths) if (L.modes.has(p)) modes[p] = L.modes.get(p);
  $("lyricStart").disabled = true;
  try {
    const r = await post("/api/lyrics/start", { paths: paths, modes: modes });
    toast(t("lyrics.started", { n: r.queued }));
  } catch (err) {
    toast(t("run.startFailed", { msg: err.message }), "err");
    $("lyricStart").disabled = false;
  }
}

function syncLyricChecks() {
  L.rows.forEach((li, p) => {
    const cb = li.querySelector(".item-check");
    if (cb && !cb.disabled) cb.checked = L.selected.has(p);
  });
  updateLyricSummary();
  updateLyricBar();
}

// A finished batch changes which files carry lyrics, so the rows are settled
// from the server's own record rather than by re-reading every file — and the
// record rather than the events this page happened to see, because a phone that
// slept through half the run would otherwise report a count that never happened.
async function finishLyrics() {
  try {
    const st = await api("/api/lyrics/state");
    L.jobs.clear();
    (st.items || []).forEach((it) => L.jobs.set(it.path, it));
    L.running = !!st.running;
    L.batch.total = (st.items || []).length;
    L.batch.done = (st.items || []).filter((it) => it.state !== "pending" && it.state !== "running").length;
  } catch (_) {}

  let ok = 0, fail = 0, review = 0;
  L.jobs.forEach((it) => {
    if (it.state === "done" && it.lyrics !== "none") {
      ok++;
      const e = L.byPath.get(it.path);
      if (e) e.hasLyrics = true;
    } else if (it.state === "failed") fail++;
    else if (it.state === "review") review++;
    // Whatever the batch has finished with leaves the selection, the same way
    // the convert page drops its finished files: a file that is done, or that
    // was skipped because its own mode says not to fetch, has no business being
    // queued again — re-running it would cost a search for an answer already
    // known. Failed and review rows stay, because those are the ones to retry.
    if (it.state === "done" || it.state === "skipped") L.selected.delete(it.path);
  });
  if (ok || fail || review) {
    let msg = t("lyrics.result", { ok: ok, fail: fail });
    if (review) msg += " · " + t("lyrics.resultReview", { n: review });
    toast(msg, fail ? "err" : (review ? "warn" : "ok"));
  }
  L.rows.forEach((li, p) => patchLyricRow(p));
  updateLyricSummary();
  updateLyricBar();
}

/* ── Shared list helpers ────────────────────────────────────────────────── */
// Every audio list describes a row the same way; only what the page does with
// the file differs.
function audioFacts(e) {
  const secs = e.durationMs ? Math.round(e.durationMs / 1000) : 0;
  return [
    (e.artists || []).join(", "),
    e.title,
    e.format ? e.format.toUpperCase() : "",
    secs ? Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0") : "",
    e.size ? fmtBytes(e.size) : "",
  ].filter(Boolean).join(" · ");
}

// paintStateChip is the one chip every list ends a row with, written once so
// four pages cannot drift about what "skipped" looks like.
function paintStateChip(chip, state) {
  chip.className = "chip state-chip";
  chip.hidden = false;
  switch (state) {
    case "running": chip.textContent = t("state.running"); chip.classList.add("chip-run"); break;
    case "done": chip.textContent = t("state.done"); chip.classList.add("chip-ok"); break;
    case "failed": chip.textContent = t("state.failed"); chip.classList.add("chip-err"); break;
    case "review": chip.textContent = t("state.review"); chip.classList.add("chip-warn"); break;
    case "skipped": chip.textContent = t("state.skipped"); chip.classList.add("chip-warn"); break;
    default: chip.textContent = t("state.pending"); chip.hidden = true;
  }
}

/* ── .lrc page ──────────────────────────────────────────────────────────── */
// The .lrc page never fetches anything: it moves lyrics between a file's tags
// and a text file beside it, in whichever direction the user picked. The
// direction belongs to the whole batch — a folder is exported to be corrected
// and then imported back — and a run that did half of each would make one
// progress bar mean two things.
const R = {
  items: [], byPath: new Map(), rows: new Map(), jobs: new Map(),
  selected: new Set(), runPicked: new Set(),
  running: false, batch: { total: 0, done: 0 },
  loaded: false, connected: false, op: "export",
  // See S.scanning / S.total: which empty block the lyrics list shows.
  scanning: false, total: 0,
};

const LRC_OPS = ["export", "import"];

// lrcNeeded is what the current direction has work to do on, which is also
// what "select what needs it" offers.
function lrcNeeded(e) {
  if (!e || !e.writable) return false;
  return R.op === "export" ? !!e.hasLyrics : !!e.hasLrc;
}

async function scanLRC() {
  const dir = $("lrcDir").value.trim() || S.cfg.dir;
  if (!dir) return;
  const btn = $("lrcScanBtn");
  const label = btn.querySelector("span");
  const prev = label.textContent;
  btn.disabled = true;
  label.textContent = t("source.scanning");
  try {
    const recursive = $("lrcRecursive").checked ? "1" : "0";
    const items = await api("/api/audio?dir=" + encodeURIComponent(dir) + "&recursive=" + recursive);
    R.items = items;
    R.byPath = new Map(items.map((e) => [e.path, e]));
    R.loaded = true;
    if (S.cfg.dir !== dir) saveConfig({ dir: dir });
    selectLRCNeeded();
    renderLRC();
    if (!items.length) toast(t("lrc.empty"));
  } catch (err) {
    toast(t("source.scanFailed", { msg: err.message }), "err");
  } finally {
    btn.disabled = false;
    label.textContent = prev;
  }
}

function selectLRCNeeded() {
  R.selected = new Set(R.items.filter(lrcNeeded).map((e) => e.path));
}

function renderLRC() {
  const list = $("lrcList");
  R.rows.clear();
  list.innerHTML = "";

  // A batch may have touched files outside the folder on screen; their rows
  // stay so a file that was written is still visible as written.
  const known = new Set(R.items.map((e) => e.path));
  const extras = [];
  R.jobs.forEach((it, p) => { if (!known.has(p)) extras.push(it); });

  const total = R.items.length + extras.length;
  $("lrcEmpty").hidden = total > 0;
  list.hidden = total === 0;

  for (const e of R.items) list.appendChild(buildLRCRow(e));
  for (const it of extras) {
    list.appendChild(buildLRCRow({ path: it.path, name: it.name, writable: true }));
  }
  updateLRCSummary();
  updateLRCBar();
}

function buildLRCRow(e) {
  const li = document.createElement("li");
  li.className = "item";
  li.dataset.path = e.path;

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.className = "item-check";
  cb.checked = R.selected.has(e.path);
  cb.setAttribute("aria-label", e.name);
  cb.addEventListener("change", () => {
    if (cb.checked) R.selected.add(e.path);
    else R.selected.delete(e.path);
    updateLRCSummary();
    updateLRCBar();
  });

  const icon = document.createElement("span");
  icon.className = "item-icon";
  icon.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#i-subtitles"/></svg>';

  const main = document.createElement("div");
  main.className = "item-main";

  const nm = document.createElement("div");
  nm.className = "item-name";
  nm.textContent = e.name;
  nm.title = e.path;

  const sub = document.createElement("div");
  sub.className = "item-sub";
  const facts = document.createElement("span");
  facts.textContent = audioFacts(e);
  const st = document.createElement("span");
  st.className = "item-state";
  sub.append(facts, st);

  const pbar = document.createElement("div");
  pbar.className = "pbar";
  pbar.hidden = true;
  pbar.appendChild(document.createElement("i"));
  main.append(nm, sub, pbar);

  const tail = document.createElement("div");
  tail.className = "item-tail";
  const chip = document.createElement("span");
  chip.className = "chip state-chip";
  chip.hidden = true;
  tail.appendChild(chip);

  li.append(cb, icon, main, tail);
  R.rows.set(e.path, li);
  patchLRCRow(e.path);
  return li;
}

function lrcStateText(job, e) {
  if (job) {
    switch (job.state) {
      case "running": return t("stage." + (job.stage || "start"));
      case "done": return R.op === "import" ? t("lrc.imported") : t("lrc.exported");
      case "failed": return job.error || t("state.failed");
      case "skipped": return reasonText(job.reason) || t("state.skipped");
      default: return t("state.pending");
    }
  }
  if (e && !e.writable) return t("lyrics.readOnly");
  if (R.op === "import") return e && e.hasLrc ? t("lrc.fileThere") : t("lrc.fileMissing");
  return e && e.hasLyrics ? t("lyrics.hasLyrics") : t("lyrics.missing");
}

function patchLRCRow(path) {
  const li = R.rows.get(path);
  if (!li) return;
  const e = R.byPath.get(path) || null;
  const job = R.jobs.get(path) || null;
  const writable = !e || e.writable;
  const locked = R.running || !writable;
  const state = job ? job.state : "";
  const was = li.dataset.state;
  li.dataset.state = state;

  // The same rule as the other lists: a row that has finished its work leaves
  // the queue as soon as it does. Review stays — that row is waiting on an
  // answer, not on the disk.
  settlePick(R, path, was, job ? state : "", () => {
    updateLRCSummary();
    updateLRCBar();
  });

  const cb = li.querySelector(".item-check");
  cb.disabled = locked;
  cb.checked = R.selected.has(path);

  li.querySelector(".item-state").textContent = " · " + lrcStateText(job, e);

  const bar = li.querySelector(".pbar");
  if (job && job.state === "running" && job.total > 0) {
    bar.hidden = false;
    bar.firstElementChild.style.width = Math.min(100, (job.done / job.total) * 100).toFixed(1) + "%";
  } else {
    bar.hidden = true;
  }

  paintStateChip(li.querySelector(".state-chip"), state);
}

function updateLRCSummary() {
  const total = R.items.length;
  const have = R.items.filter((e) => e.writable && (R.op === "export" ? e.hasLyrics : e.hasLrc)).length;
  let text = t("lrc.found", { n: total, have: have });
  if (R.selected.size) text += " · " + t("source.selected", { n: R.selected.size });
  $("lrcSummary").textContent = text;
}

function lrcCostText() {
  if (R.op === "import") {
    let bytes = 0;
    R.selected.forEach((p) => { const e = R.byPath.get(p); if (e && e.size) bytes += e.size; });
    return t("lrc.costImport", { n: R.selected.size, size: fmtBytes(bytes) });
  }
  return t("lrc.costExport", { n: R.selected.size });
}

function updateLRCBar() {
  $("lrcStart").hidden = R.running;
  $("lrcStop").hidden = !R.running;
  $("lrcStart").disabled = R.running || R.selected.size === 0;
  $("lrcScanBtn").disabled = R.running;
  $("lrcSelAll").disabled = R.running;
  $("lrcSelNone").disabled = R.running;
  $("lrcSelNeeded").disabled = R.running;
  document.querySelectorAll("#lrcOp button").forEach((b) => { b.disabled = R.running; });

  $("lrcStartLbl").textContent = t(R.op === "import" ? "lrc.startImport" : "lrc.startExport");
  $("lrcOpHint").textContent = t(R.op === "import" ? "lrc.importHint" : "lrc.exportHint");

  const bar = $("lrcBar");
  if (!R.running) {
    $("lrcCount").textContent = t("source.selected", { n: R.selected.size });
    $("lrcStage").textContent = R.selected.size ? lrcCostText() : "";
    bar.hidden = true;
    return;
  }

  $("lrcCount").textContent = t("run.summary", { done: R.batch.done, total: R.batch.total });
  bar.hidden = !R.batch.total;
  $("lrcFill").style.width =
    (R.batch.total ? (R.batch.done / R.batch.total) * 100 : 0).toFixed(1) + "%";

  const active = [];
  R.jobs.forEach((it) => { if (it.state === "running") active.push(it); });
  $("lrcStage").textContent = active.length
    ? active.map((it) => it.name + " · " + t("stage." + (it.stage || "start"))).join("   ")
    : t("run.running");
}

function setLRCOp(op) {
  if (R.running || LRC_OPS.indexOf(op) < 0) return;
  R.op = op;
  document.querySelectorAll("#lrcOp button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.op === op));
  });
  saveUI({ lrcOp: op });
  selectLRCNeeded();
  renderLRC();
}

function syncLRCChecks() {
  R.rows.forEach((li, p) => {
    const cb = li.querySelector(".item-check");
    if (cb && !cb.disabled) cb.checked = R.selected.has(p);
  });
  updateLRCSummary();
  updateLRCBar();
}

async function startLRC() {
  const paths = Array.from(R.selected);
  if (!paths.length) { toast(t("run.nothingSelected"), "err"); return; }
  $("lrcStart").disabled = true;
  try {
    const r = await post("/api/lrc/start", { paths: paths, op: R.op });
    toast(t("lrc.started", { n: r.queued }));
  } catch (err) {
    toast(t("run.startFailed", { msg: err.message }), "err");
    $("lrcStart").disabled = false;
  }
}

async function stopLRC() {
  $("lrcStop").disabled = true;
  try {
    await post("/api/lrc/cancel", {});
  } catch (err) {
    toast(err.message, "err");
  } finally {
    $("lrcStop").disabled = false;
  }
}

// A finished batch changes what each file holds, and that is recorded on the
// server's own item list rather than guessed from the events this page
// happened to see.
async function finishLRC() {
  try {
    const st = await api("/api/lrc/state");
    R.jobs.clear();
    (st.items || []).forEach((it) => R.jobs.set(it.path, it));
    R.running = !!st.running;
    R.batch.total = (st.items || []).length;
    R.batch.done = (st.items || []).filter((it) => it.state !== "pending" && it.state !== "running").length;
  } catch (_) {}

  let ok = 0, fail = 0;
  R.jobs.forEach((it) => {
    const e = R.byPath.get(it.path);
    if (it.state === "done") {
      ok++;
      // What the batch just wrote is a fact about the file now, so the row
      // stops offering to do it again.
      if (e) {
        if (R.op === "export") e.hasLrc = true;
        else e.hasLyrics = true;
      }
    } else if (it.state === "failed") fail++;
    if (it.state === "done" || it.state === "skipped") R.selected.delete(it.path);
  });
  if (ok || fail) toast(t("lrc.result", { ok: ok, fail: fail }), fail ? "err" : "ok");
  R.rows.forEach((li, p) => patchLRCRow(p));
  updateLRCSummary();
  updateLRCBar();
}

function connectLRC() {
  if (R.connected) return;
  R.connected = true;
  const es = new EventSource("/api/lrc/events");
  es.addEventListener("message", (e) => {
    let evt;
    try { evt = JSON.parse(e.data); } catch (_) { return; }
    if (evt.kind === "item" && evt.item) {
      R.jobs.set(evt.item.path, evt.item);
      patchLRCRow(evt.item.path);
      updateLRCBar();
      return;
    }
    if (evt.kind === "batch") {
      if (evt.total) R.batch.total = evt.total;
      if (typeof evt.done === "number") R.batch.done = evt.done;
      const was = R.running;
      R.running = !!evt.run;
      if (R.running && !was) R.runPicked = new Set(R.selected);
      if (!R.running) {
        R.runPicked = new Set();
        R.rows.forEach((li, p) => patchLRCRow(p));
        if (was) finishLRC();
      }
      updateLRCBar();
    }
  });
}

async function loadLRCState() {
  try {
    const st = await api("/api/lrc/state");
    (st.items || []).forEach((it) => R.jobs.set(it.path, it));
    R.running = !!st.running;
    R.batch.total = (st.items || []).length;
    R.batch.done = (st.items || []).filter((it) => it.state !== "pending" && it.state !== "running").length;
  } catch (_) {}
}

/* ── Translation page ───────────────────────────────────────────────────── */
const A = {
  items: [], byPath: new Map(), rows: new Map(), jobs: new Map(),
  selected: new Set(), runPicked: new Set(),
  busy: new Set(), previews: new Map(),
  running: false, batch: { total: 0, done: 0 },
  loaded: false, connected: false, settingsLoaded: false,
  // view is the providers answer: which vendors exist, which have a key, and
  // which one is active.
  view: null,
  // effort is provider -> model -> the thinking levels that model takes, as the
  // vendor's own list reported them. It is what keeps the effort control from
  // offering a level the chosen model would refuse.
  effort: {},
  force: false,
};

// aiPolicy is what a file that already carries a model's translation gets:
// 0 skip it, 1 leave the decision to that row's own checkbox, 2 translate it
// again like any other file. See store.AITranslated.
function aiPolicy() {
  return Number(S.cfg.aiTranslated || 0);
}

// aiNeeded is a file with something to translate: words in its tags or in a
// .lrc beside it. A file that already carries a translation is needed only
// when the policy says to redo them; under the other two it stays off the
// queue until someone ticks its row by hand.
function aiNeeded(e) {
  if (!e || !e.writable || (!e.hasLyrics && !e.hasLrc)) return false;
  if (e.hasTranslation && aiPolicy() !== 2) return false;
  return true;
}

// aiForced reports whether ticking this row means "translate it again". A
// translated file that someone ticked is in the batch because of that tick, so
// the server has to be told; without it the standing rule would skip the file
// and the tick would have been a lie.
function aiForced(e) {
  return !!(e && e.hasTranslation) && aiPolicy() === 1;
}

function selectAINeeded() {
  A.selected = new Set(A.items.filter(aiNeeded).map((e) => e.path));
}

async function scanAI() {
  const dir = $("aiDir").value.trim() || S.cfg.dir;
  if (!dir) return;
  const btn = $("aiScanBtn");
  const label = btn.querySelector("span");
  const prev = label.textContent;
  btn.disabled = true;
  label.textContent = t("source.scanning");
  try {
    const recursive = $("aiRecursive").checked ? "1" : "0";
    const items = await api("/api/audio?dir=" + encodeURIComponent(dir) + "&recursive=" + recursive);
    A.items = items;
    A.byPath = new Map(items.map((e) => [e.path, e]));
    A.loaded = true;
    if (S.cfg.dir !== dir) saveConfig({ dir: dir });
    A.selected = new Set(items.filter(aiNeeded).map((e) => e.path));
    renderAI();
    if (!items.length) toast(t("ai.empty"));
  } catch (err) {
    toast(t("source.scanFailed", { msg: err.message }), "err");
  } finally {
    btn.disabled = false;
    label.textContent = prev;
  }
}

function renderAI() {
  const list = $("aiList");
  A.rows.clear();
  list.innerHTML = "";

  const known = new Set(A.items.map((e) => e.path));
  const extras = [];
  A.jobs.forEach((it, p) => { if (!known.has(p)) extras.push(it); });

  const total = A.items.length + extras.length;
  $("aiEmpty").hidden = total > 0;
  list.hidden = total === 0;

  for (const e of A.items) list.appendChild(buildAIRow(e));
  for (const it of extras) {
    list.appendChild(buildAIRow({ path: it.path, name: it.name, writable: true }));
  }
  updateAISummary();
  updateAIBar();
}

function buildAIRow(e) {
  const li = document.createElement("li");
  li.className = "item";
  li.dataset.path = e.path;

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.className = "item-check";
  cb.checked = A.selected.has(e.path);
  cb.setAttribute("aria-label", e.name);
  cb.addEventListener("change", () => {
    if (cb.checked) A.selected.add(e.path);
    else A.selected.delete(e.path);
    updateAISummary();
    updateAIBar();
  });

  const icon = document.createElement("span");
  icon.className = "item-icon";
  icon.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#i-languages"/></svg>';

  const main = document.createElement("div");
  main.className = "item-main";

  const nm = document.createElement("div");
  nm.className = "item-name";
  nm.textContent = e.name;
  nm.title = e.path;

  const sub = document.createElement("div");
  sub.className = "item-sub";
  const facts = document.createElement("span");
  facts.textContent = audioFacts(e);
  const st = document.createElement("span");
  st.className = "item-state";
  sub.append(facts, st);

  const pbar = document.createElement("div");
  pbar.className = "pbar";
  pbar.hidden = true;
  pbar.appendChild(document.createElement("i"));

  const box = document.createElement("div");
  box.className = "cands";
  box.hidden = true;
  main.append(nm, sub, pbar, box);

  const tail = document.createElement("div");
  tail.className = "item-tail";
  const prev = document.createElement("button");
  prev.type = "button";
  prev.className = "btn btn-sm btn-quiet";
  prev.textContent = t("ai.preview");
  prev.disabled = !e.writable;
  prev.addEventListener("click", (ev) => {
    ev.stopPropagation();
    toggleAIPreview(e.path);
  });
  tail.appendChild(prev);
  const chip = document.createElement("span");
  chip.className = "chip state-chip";
  chip.hidden = true;
  tail.appendChild(chip);

  li.append(cb, icon, main, tail);
  A.rows.set(e.path, li);
  patchAIRow(e.path);
  return li;
}

function aiStateText(job, e) {
  if (job) {
    switch (job.state) {
      case "running": return t("stage." + (job.stage || "start"));
      case "done": return t("ai.translated");
      case "failed": return job.error || t("state.failed");
      case "skipped": return reasonText(job.reason) || t("state.skipped");
      default: return t("state.pending");
    }
  }
  if (e && !e.writable) return t("lyrics.readOnly");
  if (e && e.hasTranslation) {
    const who = e.translationSource ? t("ai.translatedBy", { who: e.translationSource }) : t("ai.translated");
    // The standing rule follows the words, so a row says which way it is about
    // to go rather than leaving it to be discovered in the results.
    if (aiPolicy() === 2) return who + " · " + t("ai.willRedo");
    return who + " · " + (aiPolicy() === 1 ? t("ai.willPick") : t("ai.willSkip"));
  }
  if (aiNeeded(e)) return t("ai.canTranslate");
  return t("lyrics.missing");
}

function patchAIRow(path) {
  const li = A.rows.get(path);
  if (!li) return;
  const e = A.byPath.get(path) || null;
  const job = A.jobs.get(path) || null;
  const writable = !e || e.writable;
  const locked = A.running || !writable;
  const state = job ? job.state : "";
  const was = li.dataset.state;
  li.dataset.state = state;

  // Same rule as the other lists, for the same reason: a translated file
  // leaves the queue as soon as it is translated. Review stays, because that
  // row is waiting on an answer rather than on the model.
  settlePick(A, path, was, job ? state : "", () => {
    updateAISummary();
    updateAIBar();
  });

  const cb = li.querySelector(".item-check");
  cb.disabled = locked;
  cb.checked = A.selected.has(path);

  li.querySelector(".item-state").textContent = " · " + aiStateText(job, e);

  const bar = li.querySelector(".pbar");
  if (job && job.state === "running" && job.total > 0) {
    bar.hidden = false;
    bar.firstElementChild.style.width = Math.min(100, (job.done / job.total) * 100).toFixed(1) + "%";
  } else {
    bar.hidden = true;
  }

  li.querySelector("button.btn-quiet").disabled = locked;
  paintStateChip(li.querySelector(".state-chip"), state);
}

function updateAISummary() {
  const total = A.items.length;
  const ready = A.items.filter(aiNeeded).length;
  let text = t("ai.found", { n: total, ready: ready });
  if (A.selected.size) text += " · " + t("source.selected", { n: A.selected.size });
  $("aiSummary").textContent = text;
}

function updateAIBar() {
  $("aiStart").hidden = A.running;
  $("aiStop").hidden = !A.running;
  $("aiScanBtn").disabled = A.running;
  $("aiSelAll").disabled = A.running;
  $("aiSelNone").disabled = A.running;
  $("aiSelNeeded").disabled = A.running;
  $("aiForce").disabled = A.running;
  $("aiProvider").disabled = A.running;
  $("aiModel").disabled = A.running;
  $("aiTarget").disabled = A.running;
  $("aiFetchModels").disabled = A.running;
  $("aiThinking").disabled = A.running;

  const canRun = aiConfigured();
  $("aiStart").disabled = A.running || A.selected.size === 0 || !canRun;
  // A start that would be refused says why on the button rather than in a
  // toast after the tap.
  $("aiStart").title = canRun ? "" : t("ai.notConfigured");

  const bar = $("aiBar");
  if (!A.running) {
    $("aiCount").textContent = t("source.selected", { n: A.selected.size });
    $("aiStage").textContent = A.selected.size
      ? t("ai.cost", { n: A.selected.size })
      : (canRun ? "" : t("ai.notConfigured"));
    bar.hidden = true;
    return;
  }

  $("aiCount").textContent = t("run.summary", { done: A.batch.done, total: A.batch.total });
  bar.hidden = !A.batch.total;
  $("aiFill").style.width =
    (A.batch.total ? (A.batch.done / A.batch.total) * 100 : 0).toFixed(1) + "%";

  const active = [];
  A.jobs.forEach((it) => { if (it.state === "running") active.push(it); });
  $("aiStage").textContent = active.length
    ? active.map((it) => it.name + " · " + t("stage." + (it.stage || "start"))).join("   ")
    : t("run.running");
}

function syncAIChecks() {
  A.rows.forEach((li, p) => {
    const cb = li.querySelector(".item-check");
    if (cb && !cb.disabled) cb.checked = A.selected.has(p);
  });
  updateAISummary();
  updateAIBar();
}

async function startAI() {
  const paths = Array.from(A.selected);
  if (!paths.length) { toast(t("run.nothingSelected"), "err"); return; }
  $("aiStart").disabled = true;
  // Ticking a translated row is the one-file version of the batch force box,
  // and it is sent the same way so the two cannot disagree.
  const forcePaths = paths.filter((p) => aiForced(A.byPath.get(p)));
  try {
    const r = await post("/api/ai/start", { paths: paths, force: A.force, forcePaths: forcePaths });
    toast(t("ai.started", { n: r.queued }));
  } catch (err) {
    toast(t("run.startFailed", { msg: err.message }), "err");
    $("aiStart").disabled = false;
  }
}

async function stopAI() {
  $("aiStop").disabled = true;
  try {
    await post("/api/ai/cancel", {});
  } catch (err) {
    toast(err.message, "err");
  } finally {
    $("aiStop").disabled = false;
  }
}

async function finishAI() {
  try {
    const st = await api("/api/ai/state");
    A.jobs.clear();
    (st.items || []).forEach((it) => A.jobs.set(it.path, it));
    A.running = !!st.running;
    A.batch.total = (st.items || []).length;
    A.batch.done = (st.items || []).filter((it) => it.state !== "pending" && it.state !== "running").length;
  } catch (_) {}

  let ok = 0, fail = 0;
  A.jobs.forEach((it) => {
    const e = A.byPath.get(it.path);
    if (it.state === "done") {
      ok++;
      if (e) {
        e.hasTranslation = true;
        e.translationSource = (A.view && A.view.provider) || "ai";
      }
    } else if (it.state === "failed") fail++;
    if (it.state === "done" || it.state === "skipped") A.selected.delete(it.path);
  });
  if (ok || fail) toast(t("ai.result", { ok: ok, fail: fail }), fail ? "err" : "ok");
  A.rows.forEach((li, p) => patchAIRow(p));
  updateAISummary();
  updateAIBar();
}

function connectAI() {
  if (A.connected) return;
  A.connected = true;
  const es = new EventSource("/api/ai/events");
  es.addEventListener("message", (e) => {
    let evt;
    try { evt = JSON.parse(e.data); } catch (_) { return; }
    if (evt.kind === "item" && evt.item) {
      A.jobs.set(evt.item.path, evt.item);
      patchAIRow(evt.item.path);
      updateAIBar();
      return;
    }
    if (evt.kind === "batch") {
      if (evt.total) A.batch.total = evt.total;
      if (typeof evt.done === "number") A.batch.done = evt.done;
      const was = A.running;
      A.running = !!evt.run;
      if (A.running && !was) A.runPicked = new Set(A.selected);
      if (!A.running) {
        A.runPicked = new Set();
        A.rows.forEach((li, p) => patchAIRow(p));
        if (was) finishAI();
      }
      updateAIBar();
    }
  });
}

async function loadAIState() {
  try {
    const st = await api("/api/ai/state");
    (st.items || []).forEach((it) => A.jobs.set(it.path, it));
    A.running = !!st.running;
    A.batch.total = (st.items || []).length;
    A.batch.done = (st.items || []).filter((it) => it.state !== "pending" && it.state !== "running").length;
  } catch (_) {}
}

/* ── Translation settings ───────────────────────────────────────────────── */
async function loadAISettings() {
  try {
    A.view = await api("/api/ai/providers");
    renderAISettings();
  } catch (_) {}
}

function currentAIProvider() {
  const id = $("aiProvider").value;
  return ((A.view && A.view.providers) || []).find((p) => p.id === id) || null;
}

function renderAISettings() {
  const v = A.view;
  if (!v) return;

  const sel = $("aiProvider");
  sel.innerHTML = "";
  for (const p of v.providers || []) {
    const o = document.createElement("option");
    o.value = p.id;
    o.textContent = p.label;
    sel.appendChild(o);
  }
  sel.value = v.provider;
  // An empty setting means the vendor's own default, and the dropdown says so
  // by naming it rather than by sitting blank: an empty select is a control
  // that looks broken and hides which model a batch would actually call.
  const active = currentAIProvider();
  fillAIModels(v.model || (active && active.defaultModel) || "");

  if (document.activeElement !== $("aiTarget")) $("aiTarget").value = v.target || "";

  const list = $("aiTargetList");
  list.innerHTML = "";
  for (const lang of v.targets || []) {
    const o = document.createElement("option");
    o.value = lang;
    list.appendChild(o);
  }

  renderAIThinking();
  renderAIKeyHint();
  updateAIBar();
}

// fillAIModels fills the model dropdown: the vendor's own models first, then
// whatever its list endpoint last returned. The selected model is kept, and one
// that is configured but in neither list — a model retired upstream, or typed
// before this was a dropdown — is added as an option of its own rather than
// being silently dropped from the settings it is still stored in.
// `want` is the model that should end up selected; left out, it is whatever is
// selected now, which is what a re-fill after a fetch means.
function fillAIModels(want) {
  const p = currentAIProvider();
  const sel = $("aiModel");
  if (want === undefined) want = sel.value || (A.view && A.view.model) || "";
  sel.innerHTML = "";
  const seen = new Set();
  const known = (A.view && A.view.known && A.view.known[$("aiProvider").value]) || [];
  for (const m of ((p && p.models) || []).concat(known, want ? [want] : [])) {
    if (!m || seen.has(m)) continue;
    seen.add(m);
    const o = document.createElement("option");
    o.value = m;
    o.textContent = m;
    sel.appendChild(o);
  }
  sel.value = want;
}

// The thinking control belongs to one vendor, and inside that vendor to the
// models that take it. Levels the vendor's own list reported for the chosen
// model narrow the offer further; with no list fetched, all of them stand.
const THINKING_KEYS = {
  "": "ai.thinkDefault", off: "ai.thinkOff", low: "ai.thinkLow",
  high: "ai.thinkHigh", max: "ai.thinkMax",
};

function aiLevelsFor(model) {
  const e = (A.effort && A.effort[$("aiProvider").value]) || null;
  return (e && e[model]) || null;
}

function renderAIThinking() {
  const p = currentAIProvider();
  const wrap = $("aiThinkingWrap");
  const on = !!(p && p.thinking);
  wrap.hidden = !on;
  if (!on) return;

  const sel = $("aiThinking");
  const cur = (A.view && A.view.thinking) || "";
  const levels = aiLevelsFor($("aiModel").value.trim());
  sel.innerHTML = "";
  for (const lv of (A.view && A.view.thinkingLevels) || []) {
    // "off" is a real choice on every thinking model; the effort levels are
    // only offered for a model the vendor said supports them.
    if (lv !== "" && lv !== "off" && levels && levels.indexOf(lv) < 0) continue;
    const o = document.createElement("option");
    o.value = lv;
    o.textContent = t(THINKING_KEYS[lv] || "ai.thinkDefault");
    sel.appendChild(o);
  }
  // A level the panel cannot offer any more is left showing rather than
  // silently dropped: the setting is still in force on the server.
  if (cur && !Array.from(sel.options).some((o) => o.value === cur)) {
    const o = document.createElement("option");
    o.value = cur;
    o.textContent = t(THINKING_KEYS[cur] || "ai.thinkDefault");
    sel.appendChild(o);
  }
  sel.value = cur;
  sel.disabled = A.running;
}

function setAIModelNote(text, kind) {
  const note = $("aiModelNote");
  note.textContent = text || "";
  note.className = kind === "err" ? "note-err" : "";
}

function renderAIKeyHint() {
  const p = currentAIProvider();
  const hint = $("aiKeyHint");
  hint.textContent = "";
  if (!p) return;
  hint.appendChild(document.createTextNode(
    (p.hasKey ? t("ai.keyStored") : t("ai.keyMissing")) + " · "));
  const a = document.createElement("a");
  a.href = p.keyUrl;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = t("ai.keyGet");
  hint.appendChild(a);
}

// aiConfigured is the same test the server makes before starting a batch, so
// the button and the refusal cannot disagree.
function aiConfigured() {
  const p = currentAIProvider();
  if (!A.view || !p) return A.view === null; // unknown until the settings load
  return p.hasKey && !!$("aiTarget").value.trim();
}

async function saveAIKey(key) {
  const provider = $("aiProvider").value;
  try {
    A.view = await post("/api/ai/key", { provider: provider, key: key });
    $("aiKey").value = "";
    renderAISettings();
    toast(key ? t("ai.keySaved") : t("ai.keyCleared"));
  } catch (err) {
    toast(t("ai.keyFailed", { msg: err.message }), "err");
  }
}

// fetchAIModels asks the vendor what the stored key can actually call. The
// built-in list is a snapshot from when this build was made, and vendors add
// and retire models between builds; the answer also carries each model's own
// thinking levels, which is the only way the panel can know that a level it
// offers is one the chosen model would take.
async function fetchAIModels() {
  const provider = $("aiProvider").value;
  const btn = $("aiFetchModels");
  btn.disabled = true;
  setAIModelNote("");
  try {
    const r = await post("/api/ai/models", { provider: provider });
    const models = r.models || [];
    const ids = models.map((m) => m.id).filter(Boolean);
    A.effort[provider] = {};
    for (const m of models) {
      if (m.id && m.effortLevels && m.effortLevels.length) A.effort[provider][m.id] = m.effortLevels;
    }
    if (A.view) {
      A.view.known = A.view.known || {};
      A.view.known[provider] = ids;
    }
    fillAIModels();
    renderAIThinking();
    setAIModelNote(t("ai.modelsFetched", { n: ids.length }));
    toast(t("ai.modelsFetched", { n: ids.length }));
  } catch (err) {
    // A refusal is not fatal: the dropdown keeps the built-in list and the
    // model last used, so the vendor's own words are the whole report.
    setAIModelNote(t("ai.modelsFailed", { msg: err.message }), "err");
    toast(t("ai.modelsFailed", { msg: err.message }), "err");
  } finally {
    btn.disabled = false;
  }
}

/* ── Translation preview ────────────────────────────────────────────────── */
// A translation costs a request per file, and the two ways to waste one are a
// file with nothing to translate and a file that has already been translated.
// The preview answers both before anything is sent.
async function toggleAIPreview(path) {
  const li = A.rows.get(path);
  if (!li) return;
  const box = li.querySelector(".cands");
  if (!box.hidden) {
    box.hidden = true;
    box.innerHTML = "";
    return;
  }
  if (A.busy.has(path)) return;
  A.busy.add(path);
  paintAIPreview(path, null);
  try {
    const pv = await post("/api/ai/preview", { path: path });
    A.previews.set(path, pv);
    paintAIPreview(path, pv);
  } catch (err) {
    box.hidden = true;
    toast(t("ai.previewFailed", { msg: err.message }), "err");
  } finally {
    A.busy.delete(path);
  }
}

const AI_FROM_KEYS = { tags: "ai.fromTags", "tags-merged": "ai.fromMerged", lrc: "ai.fromLrc" };

function paintAIPreview(path, pv) {
  const li = A.rows.get(path);
  if (!li) return;
  const box = li.querySelector(".cands");
  box.innerHTML = "";
  box.hidden = false;

  const head = document.createElement("div");
  head.className = "cands-head";
  head.appendChild(document.createElement("span")).textContent = pv
    ? t("ai.previewHead", { from: t(AI_FROM_KEYS[pv.from] || "ai.fromTags"), n: pv.lines })
    : t("ai.previewing");
  head.appendChild(document.createElement("span")).className = "spacer";
  box.appendChild(head);

  if (!pv) return;

  const dl = document.createElement("dl");
  dl.className = "facts";
  const pairs = [
    [t("ai.fProvider"), pv.provider],
    [t("ai.fModel"), pv.model || "—"],
    [t("ai.fTarget"), pv.target || "—"],
  ];
  if (pv.already) pairs.push([t("ai.fExisting"), t("ai.hasTranslation")]);
  for (const [k, v] of pairs) {
    const dt = document.createElement("dt");
    dt.textContent = k;
    const dd = document.createElement("dd");
    dd.textContent = v;
    dl.append(dt, dd);
  }
  box.appendChild(dl);

  if (!pv.ready) {
    const note = document.createElement("p");
    note.className = "secnote";
    note.textContent = reasonText(pv.reason) || pv.reason;
    box.appendChild(note);
  }

  if (pv.source) {
    const pre = document.createElement("pre");
    pre.className = "preview";
    pre.textContent = pv.source;
    box.appendChild(pre);
  }

  const run = document.createElement("button");
  run.type = "button";
  run.className = "btn btn-sm btn-quiet";
  run.textContent = t("ai.translateThis");
  // The tap is the decision: a file whose preview says it has already been
  // translated is one the user has just been told about and asked for anyway.
  run.addEventListener("click", () => runOneAI(path));
  box.appendChild(run);
}

async function runOneAI(path) {
  try {
    await post("/api/ai/start", { paths: [path], force: true });
    toast(t("ai.started", { n: 1 }));
    const li = A.rows.get(path);
    if (li) {
      const box = li.querySelector(".cands");
      box.hidden = true;
      box.innerHTML = "";
    }
  } catch (err) {
    toast(t("run.startFailed", { msg: err.message }), "err");
  }
}

/* ── Info page ──────────────────────────────────────────────────────────── */
// What the platform knows about a file, as opposed to what the file holds:
// the ids are the only trace of where a track came from once it has been
// renamed, and the only handle anything else can look it up by.
const INFO = { items: [], loaded: false, q: "", open: new Set() };

function infoMatches(e, q) {
  const hay = [
    e.name, e.title, e.album, (e.artists || []).join(" "),
    e.musicId ? String(e.musicId) : "",
    e.albumId ? String(e.albumId) : "",
    (e.artistIds || []).join(" "),
  ].join(" ").toLowerCase();
  return hay.includes(q);
}

async function scanInfo() {
  const dir = $("infoDir").value.trim() || S.cfg.dir;
  if (!dir) return;
  const btn = $("infoScanBtn");
  const label = btn.querySelector("span");
  const prev = label.textContent;
  btn.disabled = true;
  label.textContent = t("source.scanning");
  try {
    const recursive = $("infoRecursive").checked ? "1" : "0";
    INFO.items = await api("/api/audio?dir=" + encodeURIComponent(dir) + "&recursive=" + recursive);
    INFO.loaded = true;
    INFO.open.clear();
    if (S.cfg.dir !== dir) saveConfig({ dir: dir });
    renderInfo();
  } catch (err) {
    toast(t("source.scanFailed", { msg: err.message }), "err");
  } finally {
    btn.disabled = false;
    label.textContent = prev;
  }
}

function renderInfo() {
  const list = $("infoList");
  const q = INFO.q.trim().toLowerCase();
  const items = q ? INFO.items.filter((e) => infoMatches(e, q)) : INFO.items;

  list.innerHTML = "";
  $("infoEmpty").hidden = items.length > 0;
  list.hidden = items.length === 0;
  for (const e of items) list.appendChild(buildInfoRow(e));

  $("infoCount").textContent = q
    ? t("info.matching", { n: items.length, total: INFO.items.length })
    : t("info.count", { n: INFO.items.length });

  // The empty state has two different things to say: nothing here, or nothing
  // matching what was typed.
  $("infoEmpty").querySelector(".empty-title").textContent = q ? t("info.noMatch") : t("info.empty");
  $("infoEmpty").querySelector(".empty-hint").textContent = q ? t("info.noMatchHint") : t("info.emptyHint");
}

function buildInfoRow(e) {
  const li = document.createElement("li");
  li.className = "item";
  li.dataset.path = e.path;
  li.dataset.clickable = "true";
  li.tabIndex = 0;
  li.setAttribute("role", "button");
  li.setAttribute("aria-expanded", "false");
  li.setAttribute("aria-label", t("info.open") + " · " + (e.title || e.name));

  const icon = document.createElement("span");
  icon.className = "item-icon";
  icon.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#i-info"/></svg>';

  const main = document.createElement("div");
  main.className = "item-main";
  const nm = document.createElement("div");
  nm.className = "item-name";
  nm.textContent = e.title || e.name;
  nm.title = e.path;

  const sub = document.createElement("div");
  sub.className = "item-sub";
  const facts = document.createElement("span");
  facts.textContent = audioFacts(e);
  const id = document.createElement("span");
  id.className = "item-state";
  id.textContent = e.musicId ? " · ID " + e.musicId : "";
  sub.append(facts, id);

  const box = document.createElement("div");
  box.className = "cands";
  box.hidden = true;
  main.append(nm, sub, box);

  const tail = document.createElement("div");
  tail.className = "item-tail";
  tail.innerHTML = '<svg class="icon icon-sm muted" aria-hidden="true"><use href="#i-chevron-right"/></svg>';

  li.append(icon, main, tail);
  if (INFO.open.has(e.path)) toggleInfoRow(e, li);
  return li;
}

function toggleInfoRow(e, li) {
  const box = li.querySelector(".cands");
  if (INFO.open.has(e.path)) {
    INFO.open.delete(e.path);
    box.hidden = true;
    box.innerHTML = "";
    li.setAttribute("aria-expanded", "false");
    return;
  }
  INFO.open.add(e.path);
  box.hidden = false;
  box.innerHTML = "";
  const dl = document.createElement("dl");
  dl.className = "facts";
  for (const [label, value] of infoFacts(e)) {
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.textContent = value;
    dl.append(dt, dd);
  }
  box.appendChild(dl);
  li.setAttribute("aria-expanded", "true");
}

function infoFacts(e) {
  const secs = e.durationMs ? Math.round(e.durationMs / 1000) : 0;
  const rows = [
    [t("info.fTitle"), e.title || "—"],
    [t("info.fArtists"), (e.artists || []).join(", ") || "—"],
    [t("info.fAlbum"), e.album || "—"],
    [t("info.fMusicId"), e.musicId ? String(e.musicId) : "—"],
    [t("info.fAlbumId"), e.albumId ? String(e.albumId) : "—"],
    [t("info.fArtistIds"), (e.artistIds || []).join(", ") || "—"],
    [t("info.fFormat"), (e.format || "?").toUpperCase() + (e.writable ? "" : " · " + t("lyrics.readOnly"))],
    [t("info.fBitrate"), e.bitrate ? e.bitrate + " kbps" : "—"],
    [t("info.fDuration"), secs ? Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0") : "—"],
    [t("info.fSize"), e.size ? fmtBytes(e.size) : "—"],
    [t("info.fModified"), e.modTime ? fmtDate(e.modTime) : "—"],
    [t("info.fLyrics"), e.hasLyrics ? t("info.yes") : t("info.no")],
    [t("info.fLrc"), e.lrcPath ? e.lrcPath + (e.hasLrc ? "" : " · " + t("info.notThere")) : "—"],
    [t("info.fCover"), e.hasCover ? t("info.yes") : t("info.no")],
  ];
  if (e.hasTranslation || e.translationSource) {
    rows.push([t("info.fTranslation"),
      [e.translationSource, e.translationModel].filter(Boolean).join(" · ") || t("info.byPerson")]);
  }
  rows.push([t("info.fPath"), e.path]);
  return rows;
}

/* ── Covers page ────────────────────────────────────────────────────────── */
const C = { items: [], loaded: false, q: "" };

function coverMatches(e, q) {

function renderCovers() {

function buildCoverRow(e) {
  const li = document.createElement("li");
  li.className = "item";
  li.dataset.path = e.path;
  const label = e.title || e.name;
  // Only a container this program can rewrite offers the editor. A row that
  // opened it anyway would flash a dialog and close it again with an error,
  // since the manifest cannot even be read for a format the tag layer does not
  // know — a worse answer than saying up front that the file is out of reach.
  if (e.writable) {
    li.dataset.clickable = "true";
    li.tabIndex = 0;
    li.setAttribute("role", "button");
    li.setAttribute("aria-label", t("covers.open") + " · " + label);
  }

  // The cover is read straight from the file — no library, no manifest — so a
  // file that has one shows it and a file that does not says so.
  if (e.hasCover) {
    const img = document.createElement("img");
    img.className = "thumb";
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = "";
    img.src = "/api/cover/image?path=" + encodeURIComponent(e.path) + "&id=current";
    img.addEventListener("error", () => img.replaceWith(thumbPlaceholder()));
    li.appendChild(img);
  } else {
    li.appendChild(thumbPlaceholder());
  }

  const main = document.createElement("div");
  main.className = "item-main";
  const nm = document.createElement("div");
  nm.className = "item-name";
  nm.textContent = label;
  nm.title = e.path;
  const sub = document.createElement("div");
  sub.className = "item-sub";
  const facts = document.createElement("span");
  const secs = e.durationMs ? Math.round(e.durationMs / 1000) : 0;
  facts.textContent = [
    (e.artists || []).join(", "),
    e.album,
    e.size ? fmtBytes(e.size) : "",
    secs ? Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0") : "",
  ].filter(Boolean).join(" · ");
  sub.appendChild(facts);
  main.append(nm, sub);
  li.appendChild(main);

  const tail = document.createElement("div");
  tail.className = "item-tail";
  if (!e.writable) {
    // The base chip is the quiet one: this is a fact about the row, not a
    // problem with it, so it should not wear a warning colour.
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = t("lyrics.readOnly");
    chip.title = t("lyrics.readOnly");
    tail.appendChild(chip);
  } else if (!e.hasCover) {
    const chip = document.createElement("span");
    chip.className = "chip chip-warn";
    chip.textContent = t("covers.noCover");
    tail.appendChild(chip);
  }
  if (e.writable) {
    tail.innerHTML += '<svg class="icon icon-sm muted" aria-hidden="true"><use href="#i-chevron-right"/></svg>';
  }
  li.appendChild(tail);

  if (e.writable) {
    const open = () => cover.open(e.path);
    li.addEventListener("click", open);
    li.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); }
    });
  }
  return li;
}

function thumbPlaceholder() {
  const span = document.createElement("span");
  span.className = "thumb thumb-none";
  span.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#i-image"/></svg>';
  return span;
}

async function stopLyrics() {
  $("lyricStop").disabled = true;
  try {
    await post("/api/lyrics/cancel", {});
  } catch (err) {
    toast(err.message, "err");
  } finally {
    $("lyricStop").disabled = false;
  }
}

// The backfill streams on its own connection: a conversion may be running at
// the same time, and a page opened halfway through a backfill still has to be
// able to see what the batch has decided.
function connectLyrics() {
  const es = new EventSource("/api/lyrics/events");
  es.addEventListener("message", (e) => {
    let evt;
    try { evt = JSON.parse(e.data); } catch (_) { return; }

    if (evt.kind === "item" && evt.item) {
      L.jobs.set(evt.item.path, evt.item);
      patchLyricRow(evt.item.path);
      updateLyricBar();
      return;
    }
    if (evt.kind === "batch") {
      if (evt.total) L.batch.total = evt.total;
      if (typeof evt.done === "number") L.batch.done = evt.done;
      const was = L.running;
      L.running = !!evt.run;
      if (L.running && !was) L.runPicked = new Set(L.selected);
      if (!L.running) {
        L.runPicked = new Set();
        L.rows.forEach((li, p) => patchLyricRow(p));
        if (was) finishLyrics();
      }
      updateLyricBar();
    }
  });
}

// loadLyricState is what makes the page survive being closed: the batch keeps
// running and the rows it left — including any waiting on a decision — come
// back with it.
async function loadLyricState() {
  try {
    const st = await api("/api/lyrics/state");
    (st.items || []).forEach((it) => L.jobs.set(it.path, it));
    L.running = !!st.running;
    L.batch.total = (st.items || []).length;
    L.batch.done = (st.items || []).filter((it) => it.state !== "pending" && it.state !== "running").length;
  } catch (_) {}
}
