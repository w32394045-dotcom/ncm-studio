/* ── Cover editor ───────────────────────────────────────────────────────── */
const cover = {
  path: "",
  data: null,
  // Bumped on every reload so the "current" image — which carries no ETag,
  // since it is whatever the file holds right now — is not served from cache.
  version: 0,
  busy: false,

  async open(path) {
    this.path = path;
    this.data = null;
    this.busy = false;
    $("coverTrack").textContent = baseName(path);
    $("coverPath").textContent = path;
    $("coverShot").hidden = true;
    $("coverShotEmpty").hidden = false;
    $("coverFile").value = "";
    if (!$("cover").open) $("cover").showModal();
    try {
      await this.load();
    } catch (err) {
      $("cover").close();
      toast(t("cover.loadFailed", { msg: err.message }), "err");
    }
  },

  async load() {
    this.data = await api("/api/cover?path=" + encodeURIComponent(this.path));
    this.version++;
    this.render();
  },

  imageURL(id) {
    let url = "/api/cover/image?path=" + encodeURIComponent(this.path) +
      "&id=" + encodeURIComponent(id);
    if (id === "current") url += "&v=" + this.version;
    return url;
  },

  render() {
    const m = this.data;
    if (!m) return;

    if (m.hasCover) {
      $("coverShot").src = this.imageURL("current");
      $("coverShot").alt = t("cover.current") + " · " + baseName(this.path);
      $("coverShot").hidden = false;
      $("coverShotEmpty").hidden = true;
    } else {
      $("coverShot").removeAttribute("src");
      $("coverShot").hidden = true;
      $("coverShotEmpty").hidden = false;
    }

    const of = (kind) => (m.entries || []).filter((e) => e.kind === kind);
    this.renderSection($("coverOriginal"), $("coverOriginalNone"), of("original"), false);
    this.renderSection($("coverNetease"), null, of("netease"), true);
    this.renderSection($("coverHistory"), $("coverHistoryNone"), of("history"), true);

    const note = $("coverNeteaseNote");
    if (!of("netease").length) {
      note.textContent = m.musicId ? t("cover.noNetease") : t("cover.noMusicId");
      note.hidden = false;
    } else {
      note.hidden = true;
    }
    $("coverFetch").hidden = !m.musicId;

    this.syncButtons();
  },

  renderSection(list, emptyNote, entries, deletable) {
    list.innerHTML = "";
    for (const e of entries) list.appendChild(this.tile(e, deletable));
    if (emptyNote) emptyNote.hidden = entries.length > 0;
  },

  tile(entry, deletable) {
    const isCurrent = entry.id === this.data.current;
    const li = document.createElement("li");
    li.className = "tile";
    if (isCurrent) li.dataset.current = "true";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tile-btn";
    btn.disabled = isCurrent || this.busy;
    btn.setAttribute("aria-pressed", String(isCurrent));
    btn.title = isCurrent ? t("cover.current") : t("cover.apply");
    // The tile carries no visible text of its own, so the name has to be built:
    // a row of buttons all called "use this one" would be useless read aloud.
    btn.setAttribute("aria-label",
      (isCurrent ? t("cover.current") : t("cover.apply")) + " · " +
      fmtBytes(entry.size) + " · " + (entry.label || entry.id));

    const img = document.createElement("img");
    img.className = "tile-img";
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = "";
    img.src = this.imageURL(entry.id);
    btn.appendChild(img);
    btn.addEventListener("click", () => this.apply(entry.id));
    li.appendChild(btn);

    const foot = document.createElement("div");
    foot.className = "tile-foot";
    const cap = document.createElement("span");
    cap.className = "tile-cap";
    cap.textContent = fmtBytes(entry.size) + " · " + fmtDate(entry.at);
    cap.title = entry.label || entry.id;
    foot.appendChild(cap);

    if (isCurrent) {
      const badge = document.createElement("span");
      badge.className = "tile-badge";
      badge.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>';
      const label = document.createElement("span");
      label.textContent = t("cover.current");
      badge.appendChild(label);
      foot.appendChild(badge);
    } else if (deletable) {
      const del = document.createElement("button");
      del.type = "button";
      del.className = "tile-del";
      del.title = t("cover.delete");
      del.setAttribute("aria-label", t("cover.delete"));
      del.disabled = this.busy;
      del.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#i-trash"/></svg>';
      del.addEventListener("click", () => this.forget(entry.id));
      foot.appendChild(del);
    } else {
      // The original: shown as locked rather than hidden, so it is clear the
      // slot exists and is deliberately being kept.
      const lock = document.createElement("span");
      lock.className = "tile-lock";
      lock.title = t("cover.protected");
      lock.innerHTML = '<svg class="icon icon-sm" aria-hidden="true"><use href="#i-shield"/></svg>';
      foot.appendChild(lock);
    }

    li.appendChild(foot);
    return li;
  },

  syncButtons() {
    $("coverUpload").disabled = this.busy;
    $("coverRemove").disabled = this.busy || !(this.data && this.data.hasCover);
    $("coverFetch").disabled = this.busy;
  },

  setBusy(label) {
    this.busy = !!label;
    $("coverBusy").hidden = !label;
    if (label) $("coverBusyText").textContent = label;
    // Every tile goes dead for the duration: two rewrites at once would race on
    // the same file, and the file is the one thing that must not be lost.
    document.querySelectorAll("#cover .tile-btn, #cover .tile-del").forEach((b) => {
      b.disabled = this.busy;
    });
    this.syncButtons();
  },

  async run(label, call, okMsg, failKey) {
    this.setBusy(label);
    try {
      this.data = await call();
      this.version++;
      this.render();
      if (okMsg) toast(okMsg);
      return true;
    } catch (err) {
      toast(t(failKey, { msg: err.message }), "err");
      return false;
    } finally {
      this.setBusy("");
    }
  },

  apply(id) {
    return this.run(t("cover.applying"),
      () => post("/api/cover/apply", { path: this.path, id: id }),
      t("cover.applied"), "cover.applyFailed");
  },

  remove() {
    return this.run(t("cover.applying"),
      () => post("/api/cover/remove", { path: this.path }),
      t("cover.removed"), "cover.removeFailed");
  },

  forget(id) {
    return this.run(t("cover.working"),
      () => post("/api/cover/forget", { path: this.path, id: id }),
      t("cover.deleted"), "cover.deleteFailed");
  },

  fetch() {
    return this.run(t("cover.fetching"),
      () => post("/api/cover/fetch", { path: this.path }),
      t("cover.fetched"), "cover.fetchFailed");
  },

  async upload(file) {
    if (!file) return;
    const looksRight = /^image\/(jpeg|png|webp|gif)$/.test(file.type) ||
      /\.(jpe?g|png|webp|gif)$/i.test(file.name || "");
    if (!looksRight) {
      toast(t("cover.notImage"), "err");
      return;
    }
    const fd = new FormData();
    fd.append("path", this.path);
    fd.append("file", file, file.name || "cover");
    await this.run(t("cover.applying"),
      () => api("/api/cover/apply", { method: "POST", body: fd }),
      t("cover.applied"), "cover.applyFailed");
  },
};

/* ── Event stream ───────────────────────────────────────────────────────── */
function setConn(state) {
  const el = $("conn");
  el.dataset.state = state;
  el.querySelector("span").textContent = t("status." + state);
}

function connect() {
  const es = new EventSource("/api/events");

  es.addEventListener("open", () => setConn("online"));

  es.addEventListener("error", () => {
    // EventSource retries on its own; mirror that in the badge.
    setConn(es.readyState === EventSource.CLOSED ? "offline" : "reconnecting");
  });

  es.addEventListener("message", (e) => {
    let evt;
    try { evt = JSON.parse(e.data); } catch (_) { return; }

    if (evt.kind === "item" && evt.item) {
      S.jobs.set(evt.item.path, evt.item);
      S.batchPaths.add(evt.item.path);
      markDirty(evt.item.path);
      return;
    }
    if (evt.kind === "batch") {
      if (evt.total) S.batch.total = evt.total;
      if (typeof evt.done === "number") S.batch.done = evt.done;
      const was = S.running;
      S.running = !!evt.run;
      if (S.running && !was) {
        S.batchPaths = new Set();
        // Snapshot the queue: it is what lets each row drop its own tick as it
        // lands, whether or not this page saw every state in between.
        S.runPicked = new Set(S.selected);
      }
      if (!S.running) {
        // Stale by definition once the run is over; the next batch takes its
        // own snapshot.
        S.runPicked = new Set();
        // A finished batch may have changed which files count as done.
        refreshStates();
        if (was) maybeAskDelete();
      }
      updateActionBar();
      renderRunBar();
    }
  });
}

/* ── The source files, once they are no longer needed ───────────────────── */
// With "ask" chosen in the settings, a batch that decrypted anything offers to
// remove the .ncm files it came from. The offer is about the batch, not about
// each file: one dialog at the end is a decision somebody can make, where one
// per file would be a dialog to dismiss forty times.
async function maybeAskDelete() {
  if (Number(S.cfg.deleteSource) !== 2) return;
  const paths = [];
  S.batchPaths.forEach((p) => {
    const it = S.jobs.get(p);
    // Only what this run actually produced: a file that was skipped, that
    // failed, or that was already decrypted still needs the source it came
    // from — and for the last of those nothing was written in front of us.
    if (!it || it.cached || it.removed) return;
    if (it.state !== "done" || !it.output) return;
    paths.push(p);
  });
  if (!paths.length) return;
  const size = S.files.reduce((n, f) => n + (paths.indexOf(f.path) >= 0 ? f.size || 0 : 0), 0);
  const ok = await askConfirm({
    title: t("run.askTitle"),
    body: t("run.askBody", { n: paths.length }) + (size ? " (" + fmtBytes(size) + ")" : ""),
    danger: true,
    confirmText: t("common.delete"),
  });
  // Scanned again rather than patched: the rows for the files just removed have
  // to go, and only the disk knows which ones are still there.
  if (ok && await deleteFiles(paths)) scan();
}

// refreshStates re-checks the scanned files against the server's record, so
// the "already decrypted" chips catch up after a batch.
let refreshTimer = 0;
function refreshStates() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    try {
      const dir = $("srcDir").value.trim() || S.cfg.dir;
      if (!dir) return;
      const recursive = $("recursive").checked ? "1" : "0";
      const files = await api("/api/files?dir=" + encodeURIComponent(dir) + "&recursive=" + recursive);
      const prevSel = new Set(S.selected);
      S.files = files;
      S.selected = new Set();
      // What was ticked and is still waiting stays ticked; nothing else is
      // added. Selecting the undone files again here would undo every tick
      // somebody deliberately cleared before starting a run.
      for (const f of files) {
        if (f.state !== "done" && prevSel.has(f.path)) S.selected.add(f.path);
      }
      renderFiles();
      const ok = files.filter((f) => S.jobs.get(f.path) && S.jobs.get(f.path).state === "done").length;
      const fail = files.filter((f) => S.jobs.get(f.path) && S.jobs.get(f.path).state === "failed").length;
      if (ok || fail) toast(t("run.result", { ok: ok, fail: fail }), fail ? "err" : "ok");
    } catch (_) {}
  }, 350);
}

/* ── Boot ───────────────────────────────────────────────────────────────── */
async function boot() {
  try {
    const res = await fetch("i18n.json");
    S.dict = await res.json();
  } catch (_) {
    S.dict = { en: {} };
    toast("i18n.json could not be loaded", "err");
  }

  let state = null;
  try {
    state = await api("/api/state");
  } catch (err) {
    toast(err.message, "err");
  }

  if (state) {
    S.cfg = state.config || S.cfg;
    S.running = !!state.running;
    (state.items || []).forEach((it) => {
      S.jobs.set(it.path, it);
      // The record holds the last batch, so a page that opened or reloaded
      // during one still knows what it was and can offer the same clean-up at
      // the end of it.
      S.batchPaths.add(it.path);
    });
    S.meta.home = state.home || "";
    S.meta.version = state.version || "dev";
    S.meta.configDir = state.configDir || "";
    S.meta.defaultWorkspace = state.defaultWorkspace || "";
  }

  // A backfill that is still running, or that stopped on a decision waiting on
  // a person, comes back with the page rather than being lost with it.
  await loadLyricState();

  // This browser's own state comes back before anything is rendered, so the
  // first paint is already the tab and settings the user left behind.
  const ui = loadUI();

  setLang(S.cfg.lang || detectLang(), false);
  syncSettings();

  $("aboutVersion").textContent = S.meta.version;
  $("aboutConfig").textContent = S.meta.configDir || "—";
  $("srcDir").value = S.cfg.dir || "";
  $("recursive").checked = ui.recursive !== false;
  // The direction and the force flag are choices about a batch, and they are
  // remembered the same way the folders are: reopening the page should not
  // undo a decision the user made about how the next run behaves.
  if (LRC_OPS.indexOf(ui.lrcOp) >= 0) R.op = ui.lrcOp;
  document.querySelectorAll("#lrcOp button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.op === R.op));
  });
  A.force = !!ui.aiForce;
  $("aiForce").checked = A.force;
  showTab(ui.tab || "convert");

  renderDirCards();
  renderFiles();
  renderRunBar();
  updateActionBar();
  setConn("connecting");
  connect();
  connectLyrics();

  // If the page loads mid-run, pick up progress immediately.
  if (S.running) toast(t("run.running"));
  // Said separately because the two batches are independent: a page reloaded
  // during a backfill has to say so even when nothing is being converted.
  if (L.running) toast(t("lyrics.running"));

  // The .lrc and translation pages open their streams on first visit rather
  // than here — four streams held open for pages nobody is looking at is a
  // connection the browser could be using for something else — but a batch
  // that is already running is still worth saying out loud.
  Promise.all([
    api("/api/lrc/state").catch(() => null),
    api("/api/ai/state").catch(() => null),
  ]).then((st) => {
    if (st[0] && st[0].running) { R.running = true; toast(t("lrc.running")); }
    if (st[1] && st[1].running) { A.running = true; toast(t("ai.running")); }
  });

  // Someone who has never chosen their three folders gets asked before the
  // scan, because the scan's answer is one of the questions.
  if (!S.cfg.initialized) {
    showSetup();
    return;
  }

  // A first scan makes the empty state meaningful rather than blank.
  if (S.cfg.dir) scan();
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") renderRunBar();
});

boot();
})();
